<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小说创作工作台（电脑版）</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#c98b4b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="icons/icon-192.png">
<style>
/* ========== 小说创作工作台 · 全局样式 ========== */
:root {
  --bg: #f7f3ea; --bg2: #fffdf7; --panel: #fffaf0; --ink: #3a2e28; --ink2: #8a7a6a;
  --line: #e5d9c3; --accent: #c98b4b; --accent-soft: #f3e3c8; --danger: #c95b5b; --ok: #5aa469;
  --shadow: 0 8px 28px rgba(90, 70, 40, .14);
  --radius: 14px;
  --font: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
}
[data-theme="dark"] {
  --bg: #191420; --bg2: #211a2a; --panel: #271f31; --ink: #efe6d8; --ink2: #a49484;
  --line: #3c3146; --accent: #d99a5b; --accent-soft: #3a2c3f; --danger: #e07a7a; --ok: #7cbf8b;
  --shadow: 0 8px 28px rgba(0, 0, 0, .45);
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { font-family: var(--font); background: var(--bg); color: var(--ink); font-size: 15px; }
button { font-family: inherit; cursor: pointer; }
::selection { background: var(--accent-soft); }

/* ===== 基础控件 ===== */
.input, textarea.input, select.input {
  font-family: inherit; font-size: 15px; padding: 9px 12px; border: 1px solid var(--line);
  border-radius: 10px; background: var(--bg2); color: var(--ink); outline: none;
}
.input:focus { border-color: var(--accent); }
.btn {
  padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg2);
  color: var(--ink); font-size: 14px; transition: filter .15s, transform .05s;
}
.btn:active { transform: scale(.97); }
.btn:hover { filter: brightness(1.04); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.btn.danger { color: var(--danger); }
.btn.small { padding: 4px 9px; font-size: 12.5px; border-radius: 8px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.count { font-size: 12px; color: var(--ink2); white-space: nowrap; }

/* ===== 应用骨架 ===== */
#app { display: flex; flex-direction: column; height: 100dvh; }
header.top {
  display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: var(--bg2);
  border-bottom: 1px solid var(--line); z-index: 40;
}
header.top .brand { font-weight: 800; font-size: 17px; letter-spacing: 1px; color: var(--accent); }
header.top .brand small { font-weight: 400; font-size: 11px; color: var(--ink2); margin-left: 6px; }
nav.tabs { display: flex; gap: 2px; margin-left: auto; overflow-x: auto; }
nav.tabs button {
  border: none; background: none; padding: 8px 12px; border-radius: 9px; color: var(--ink2);
  font-size: 14px; white-space: nowrap;
}
nav.tabs button.on { background: var(--panel); color: var(--accent); font-weight: 700; }
main { flex: 1; overflow: hidden; position: relative; }
.page { display: none; position: absolute; inset: 0; }
.page.active { display: flex; }
nav.bottom { display: none; }

/* ===== 页面通用 ===== */
.page-inner { flex: 1; overflow: auto; padding: 18px; }
.page-title { font-size: 18px; font-weight: 700; margin-bottom: 14px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.page-title .spacer { flex: 1; }
.card {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px; margin-bottom: 12px;
}
.card h4 { font-size: 14px; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.muted { color: var(--ink2); font-size: 12.5px; }
.empty-tip { color: var(--ink2); text-align: center; padding: 40px 20px; font-size: 13.5px; line-height: 2; }

/* ===== 写作页 ===== */
.page-writing { flex-direction: row; overflow: hidden; }
.w-list {
  width: 235px; min-width: 235px; border-right: 1px solid var(--line); background: var(--bg2);
  display: flex; flex-direction: column; overflow: hidden;
}
.w-list-h { display: flex; gap: 8px; padding: 10px; border-bottom: 1px solid var(--line); align-items: center; }
.w-list-h .spacer { flex: 1; }
#chapter-list { flex: 1; overflow: auto; padding: 8px; }
.chap-item {
  padding: 9px 10px; border-radius: 10px; cursor: pointer; margin-bottom: 4px; border: 1px solid transparent;
  display: flex; align-items: center; gap: 6px;
}
.chap-item:hover { background: var(--panel); }
.chap-item.on { background: var(--panel); border-color: var(--accent); }
.chap-item .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13.5px; }
.chap-item .c { font-size: 11px; color: var(--ink2); }
.w-editor { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.w-editor-h { display: flex; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); align-items: center; flex-wrap: wrap; }
.w-editor-h #chap-title { flex: 1; min-width: 120px; font-weight: 600; }
.w-outline { padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--bg2); }
.w-outline-h { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink2); margin-bottom: 6px; flex-wrap: wrap; }
.w-outline-h .spacer { flex: 1; }
.outline-item { display: flex; align-items: center; gap: 8px; padding: 4px 2px; font-size: 13.5px; }
.outline-item input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); }
.outline-item .txt { flex: 1; }
.outline-item .txt.done { text-decoration: line-through; color: var(--ink2); }
.w-selected {
  display: flex; align-items: center; gap: 6px; padding: 6px 12px; background: var(--accent-soft);
  border-bottom: 1px solid var(--line); font-size: 12.5px; flex-wrap: wrap;
}
.w-selected[hidden] { display: none; }
#chap-content {
  flex: 1; width: 100%; border: none; outline: none; resize: none; padding: 18px;
  font-size: 16.5px; line-height: 1.9; background: var(--bg); color: var(--ink); font-family: var(--font);
}
#chap-content:read-only { opacity: .72; }
.w-ai {
  width: 350px; min-width: 350px; border-left: 1px solid var(--line); background: var(--bg2);
  display: flex; flex-direction: column; overflow: hidden;
}
.w-ai-h { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); font-weight: 700; }
.w-ai-h .ctx { font-weight: 400; font-size: 11px; color: var(--ok); }
.w-ai-h .spacer { flex: 1; }
.chat-box { flex: 1; overflow: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 92%; padding: 10px 12px; border-radius: 12px; font-size: 14px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
.msg.user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
.msg.ai { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.msg .acts { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.msg .meta { font-size: 11px; color: var(--ink2); margin-top: 6px; }
.chat-in { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--line); align-items: flex-end; }
.chat-in textarea { flex: 1; max-height: 140px; }
.chat-quick { display: flex; gap: 6px; padding: 8px 10px 0; flex-wrap: wrap; }

/* ===== 人物页 ===== */
.char-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
.char-card { cursor: pointer; }
.char-card .name { font-size: 16px; font-weight: 700; }
.char-card .bio { font-size: 12.5px; color: var(--ink2); margin-top: 6px; line-height: 1.6; max-height: 60px; overflow: hidden; }
.pending-fact { display: flex; gap: 8px; align-items: flex-start; padding: 8px; border: 1px dashed var(--accent); border-radius: 10px; margin-top: 6px; font-size: 13px; }
.pending-fact .src { font-size: 11px; color: var(--ink2); }
.relation-chip { display: inline-flex; align-items: center; gap: 4px; background: var(--bg); border: 1px solid var(--line); border-radius: 20px; padding: 3px 10px; font-size: 12px; margin: 2px; }
.rel-graph { width: 100%; height: 520px; background: var(--bg2); border: 1px solid var(--line); border-radius: var(--radius); touch-action: none; }

/* ===== 世界观 ===== */
.cat-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.cat-tabs button { border: 1px solid var(--line); background: var(--bg2); border-radius: 20px; padding: 6px 14px; font-size: 13px; color: var(--ink2); }
.cat-tabs button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.world-item .title { font-size: 15px; font-weight: 700; }
.world-item .content { font-size: 13.5px; color: var(--ink); line-height: 1.8; white-space: pre-wrap; margin-top: 6px; }

/* ===== 宗门布局 ===== */
.sect-wrap { overflow: auto; background: var(--bg2); border: 1px solid var(--line); border-radius: var(--radius); }
.sect-wrap svg { display: block; }

/* ===== 世界观页（设定库 + AI 对话） ===== */
.world-page { display: flex; flex-direction: row; }
.world-main { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.world-main .page-inner { flex: 1; overflow: auto; }
/* ===== 地图页 ===== */
.map-page { display: flex; flex-direction: row; }
.map-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.map-toolbar { display: flex; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--bg2); align-items: center; flex-wrap: wrap; }
.map-toolbar .spacer { flex: 1; }
/* ===== 地图页：手绘地图册风格（海洋大陆 / 实线国界 / 竖排国名 / 黑白山河 / 图例罗盘） ===== */
.map-board {
  position: relative; flex: 1; overflow: hidden;
  background-color: #c9dde3; /* 海洋浅蓝 */
}
.map-board::before {
  content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 0;
  background-image:
    radial-gradient(rgba(255,255,255,.35) 1px, transparent 1px),
    linear-gradient(135deg, rgba(120,160,175,.05) 25%, transparent 25%, transparent 75%, rgba(120,160,175,.05) 75%);
  background-size: 26px 26px, 60px 60px; /* 海面波纹微光 */
}
.map-board::after {
  content: ''; position: absolute; inset: 7px; pointer-events: none; z-index: 26;
  border: 1.5px solid rgba(80,62,36,.55); border-radius: 8px;
  box-shadow: inset 0 0 0 3px rgba(80,62,36,.08);
}
.map-board .dir {
  position: absolute; transform: translate(-50%, -50%); z-index: 22;
  font-size: 13px; font-weight: 700; color: #5b7180; opacity: .8;
  font-family: 'STKaiti','KaiTi','楷体',serif; letter-spacing: 2px;
  pointer-events: none; user-select: none; text-shadow: 0 1px 0 rgba(255,255,255,.5);
}
.map-board .dir.mid { display: none; }
.map-empty {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  text-align: center; white-space: pre-line; line-height: 2.1; color: #5a4630; font-size: 15px; pointer-events: none; z-index: 8;
}
/* 大陆（米黄土地 + 海岸线） */
.map-baseimg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
.map-continent { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; overflow: visible; }
.map-continent path.continent { fill: #f4e9c9; stroke: #a0804f; stroke-width: 2.6; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
.map-continent path.continent-shore { fill: none; stroke: rgba(160,128,79,.35); stroke-width: 6; vector-effect: non-scaling-stroke; }
/* 山河线（黑白手绘） */
.map-lines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; overflow: visible; }
.map-lines path.ln { vector-effect: non-scaling-stroke; fill: none; stroke-linecap: round; pointer-events: stroke; }
.map-lines path.ln-mtn { stroke: #4a4034; stroke-width: 2; opacity: .9; }
.map-lines path.ln-riv { stroke: #3a4a55; stroke-width: 2.2; opacity: .85; }
.map-lines .ln-handle { fill: #fff; stroke: #4a4034; stroke-width: 1.4; vector-effect: non-scaling-stroke; pointer-events: all; cursor: move; }
.ln-label {
  position: absolute; transform: translate(-50%, -50%); z-index: 7; cursor: pointer;
  background: rgba(250,244,226,.75); border-radius: 4px; padding: 0 5px;
  font-size: 11.5px; font-weight: 700; color: #4a4034; white-space: nowrap; pointer-events: auto;
  font-family: 'STKaiti','KaiTi','楷体',serif; letter-spacing: 1px;
}
/* 地图缩放视图容器 */
.map-view { position: absolute; inset: 0; transform-origin: center; }
/* 领土范围：虚线国界（画在大陆上） */
.map-territories { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; overflow: visible; }
.terr { fill: rgba(255,252,240,.16); stroke: #6b4f2a; stroke-width: 1.9; stroke-dasharray: 8 5; vector-effect: non-scaling-stroke; pointer-events: all; stroke-linejoin: round; }
.terr-国家 { stroke: #6b4f2a; fill: rgba(255,252,240,.2); }
.terr-州郡 { stroke: #8a6a3c; stroke-width: 1.4; stroke-dasharray: 5 4; fill: rgba(255,252,240,.1); }
.terr-蛮荒 { stroke: #6f8a5c; fill: rgba(226,236,214,.32); }
.terr:hover { stroke-width: 2.5; }
/* 底图模式下的虚线国界 */
.terr-dash { fill: none; stroke: #6b4f2a; stroke-width: 1.7; stroke-dasharray: 7 4; vector-effect: non-scaling-stroke; pointer-events: all; stroke-linejoin: round; background: transparent; }
/* 国名：竖排大字（楷体） */
.terr-name {
  position: absolute; transform: translate(-50%, -50%); z-index: 6; cursor: grab;
  writing-mode: vertical-rl; text-orientation: upright;
  font-family: 'STKaiti','KaiTi','楷体','SimSun',serif;
  font-size: calc(17px + 0.9vw); font-weight: 700; letter-spacing: 7px; line-height: 1.15;
  color: #4a3015; text-shadow: 0 1px 2px rgba(255,250,235,.9), 0 0 6px rgba(244,233,201,.7);
  max-height: 80%; user-select: none; pointer-events: auto; touch-action: none; white-space: nowrap;
}
.terr-name:active { color: #a8542a; }
/* 从属城名：小字直排（非胶囊） */
.mpin {
  position: absolute; transform: translate(-50%, -50%); z-index: 5; cursor: grab; touch-action: none;
  display: flex; align-items: center; gap: 2px;
  color: #5a3d1f; padding: 1px 4px; border-radius: 4px; user-select: none;
  font-family: 'STKaiti','KaiTi','楷体',serif;
}
.mpin .mpin-i { font-size: 11px; }
.mpin .mpin-n { font-size: 13px; font-weight: 700; white-space: nowrap; letter-spacing: 1px; }
.mpin:hover { background: rgba(255,250,235,.55); }
/* 地图标题（卷轴横幅） */
.map-title {
  position: absolute; left: 50%; top: 10px; transform: translateX(-50%); z-index: 24;
  background: rgba(244,233,201,.92); border: 1.6px solid #7a5c33; border-radius: 14px;
  padding: 3px 26px; font-size: 16px; font-weight: 800; color: #4a3015; letter-spacing: 6px;
  font-family: 'STKaiti','KaiTi','楷体',serif; pointer-events: none; white-space: nowrap;
  box-shadow: 0 2px 6px rgba(90,60,20,.18);
}
.map-title::before, .map-title::after {
  content: ''; position: absolute; top: 50%; width: 14px; height: 6px; margin-top: -3px;
  background: rgba(122,92,51,.55); border-radius: 3px;
}
.map-title::before { left: -7px; } .map-title::after { right: -7px; }
/* 图例 */
.map-legend {
  position: absolute; right: 12px; bottom: 12px; z-index: 24; pointer-events: none;
  background: rgba(250,244,226,.9); border: 1.2px solid #9a7b4f; border-radius: 8px;
  padding: 6px 10px; font-size: 11.5px; color: #4a3015; line-height: 1.9;
  font-family: 'STKaiti','KaiTi','楷体',serif;
}
.map-legend b { font-size: 12px; display: block; }
.map-legend .lg { display: flex; align-items: center; gap: 6px; }
.map-legend svg { width: 34px; height: 12px; flex: none; }
/* 罗盘 */
.map-compass { position: absolute; right: 12px; top: 12px; z-index: 24; pointer-events: none; opacity: .9; }
.only-pc { display: none; }
@media (min-width: 1201px) { .only-pc { display: inline; } }
/* 地图 AI 对话面板 */
.map-ai {
  width: 330px; min-width: 330px; border-left: 1px solid var(--line); background: var(--bg2);
  display: flex; flex-direction: column; overflow: hidden;
}
.map-ai-h { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); font-weight: 700; }
.map-ai-h .ctx { font-weight: 400; font-size: 11px; color: var(--ok); }
.map-ai-h .spacer { flex: 1; }
@media (max-width: 1200px) {
  .map-ai {
    position: fixed; right: 0; top: 0; bottom: 0; width: min(92vw, 400px); z-index: 80;
    transform: translateX(105%); transition: transform .25s; box-shadow: var(--shadow);
  }
  .map-ai.open { transform: none; }
}

/* ===== 检测页 ===== */
.issue {
  border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 10px;
  padding: 12px; margin-bottom: 10px; background: var(--panel);
}
.issue.high { border-left-color: var(--danger); }
.issue.med { border-left-color: var(--accent); }
.issue.low { border-left-color: var(--ok); }
.issue .q { font-size: 12px; font-style: italic; color: var(--ink2); background: var(--bg); padding: 6px 8px; border-radius: 8px; margin: 6px 0; }
.issue .acts { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }

/* ===== 设置页 ===== */
.settings-form { max-width: 640px; }
.settings-form .row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.settings-form label { font-size: 13px; font-weight: 600; color: var(--ink2); }
.settings-form .hint { font-size: 12px; color: var(--ink2); line-height: 1.7; }

/* ===== 日志 ===== */
.log-item { display: flex; gap: 10px; align-items: baseline; font-size: 13px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.log-item .t { color: var(--ink2); font-size: 12px; white-space: nowrap; }
.log-item .d { flex: 1; }
.log-item .tag { font-size: 11px; padding: 1px 8px; border-radius: 10px; background: var(--accent-soft); white-space: nowrap; }

/* ===== 弹窗 / 提示 ===== */
.modal-mask {
  position: fixed; inset: 0; background: rgba(20, 15, 25, .5); z-index: 200;
  display: flex; align-items: center; justify-content: center; padding: 20px;
}
.modal { background: var(--bg2); border-radius: 16px; max-width: 480px; width: 100%; box-shadow: var(--shadow); overflow: hidden; }
.modal-h { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; font-weight: 700; border-bottom: 1px solid var(--line); }
.modal-h .x { border: none; background: none; color: var(--ink2); font-size: 15px; }
.modal-b { padding: 16px; max-height: 60vh; overflow: auto; }
.modal-f { display: flex; justify-content: flex-end; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--line); }
#toast-box { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 300; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast { background: var(--panel); border: 1px solid var(--line); color: var(--ink); padding: 9px 18px; border-radius: 20px; font-size: 13.5px; box-shadow: var(--shadow); opacity: 1; transition: opacity .4s; }
.toast.ok { border-color: var(--ok); }
.toast.err { border-color: var(--danger); color: var(--danger); }
.toast.out { opacity: 0; }

/* ===== 响应式：平板 / 手机 ===== */
@media (max-width: 1200px) {
  .w-ai {
    position: fixed; right: 0; top: 0; bottom: 0; width: min(92vw, 400px); z-index: 80;
    transform: translateX(105%); transition: transform .25s; box-shadow: var(--shadow);
  }
  .w-ai.open { transform: none; }
}
@media (max-width: 768px) {
  nav.tabs { display: none; }
  nav.bottom {
    display: flex; position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg2);
    border-top: 1px solid var(--line); z-index: 70;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  nav.bottom button {
    flex: 1; padding: 9px 2px 11px; font-size: 11px; background: none; border: none;
    color: var(--ink2); display: flex; flex-direction: column; gap: 2px; align-items: center;
  }
  nav.bottom button.on { color: var(--accent); font-weight: 700; }
  /* 底部空间给到 .page 自身（absolute 定位不受 main padding 影响） */
  main { padding-bottom: 0; }
  .page { padding-bottom: calc(64px + env(safe-area-inset-bottom, 0px)); }
  .w-list {
    position: fixed; left: 0; top: 0; bottom: 0; width: min(82vw, 300px); z-index: 80;
    transform: translateX(-105%); transition: transform .25s; box-shadow: var(--shadow);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .w-list.open { transform: none; }
  .only-mobile { display: inline-block; }

    const chapters = await dbAll('chapters');
    chapters.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
    const box = $('#chapter-list', this.c);
    box.innerHTML = '';
    for (const ch of chapters) {
      box.appendChild(el('div', {
        class: 'chap-item' + (ch.id === this.curId ? ' on' : ''),
        onclick: () => this.open(ch.id)
      },
        el('span', { text: ch.locked ? '🔒' : '' }),
        el('span', { class: 't', text: ch.title }),
        el('span', { class: 'c', text: wordCount(ch.content) })
      ));
    }
  },

  async open(id) {
    // 保存旧章节（输入框中的最新值）
    if (this.curId) {
      const old = await dbGet('chapters', this.curId);
      if (old) {
        const ta = $('#chap-content', this.c);
        if (ta && ta.value !== old.content) await this.saveCur({ content: ta.value });
      }
    }
    this.curId = id;
    const ch = await dbGet('chapters', id);
    if (!ch) return;
    this.renderEditor(ch);
    this.refreshList();
  },

  renderEditor(ch) {
    $('#chap-title', this.c).value = ch.title || '';
    $('#chap-content', this.c).value = ch.content || '';
    $('#chap-content', this.c).readOnly = !!ch.locked;
    $('#btn-lock', this.c).textContent = ch.locked ? '🔓 解锁' : '🔒 锁定';
    this.updateCount();
  },

  /* ---------- AI ---------- */
  setBusy(b) {
    this.busy = b;
    const c = this.c;
    $('#qc-cont', c).disabled = b; $('#chat-send', c).disabled = b; $('#btn-analyze', c).disabled = b; $('#btn-review', c).disabled = b; $('#qc-ideas', c).disabled = b;
  },

  /* 🔍 全文审校（融合 Novel-OS 编辑流水线 + novel-writing-framework 去 AI 味） */
  async reviewChapter() {
    await this.flushSave(); // 先保存最新正文再审校（防止读到防抖中的旧内容）
    const ch = await this.getCur();
    if (!ch) return;
    if (!(ch.content || '').trim()) { toast('本章还没有正文', 'err'); return; }
    this.setBusy(true);
    toast('🔍 AI 正在全文审校（逻辑/人设/文风/节奏/AI腔）…', 'info');
    try {
      const ctx = await AI.projectContext({ chapterId: ch.id });
      const data = await AI.json([
        { role: 'system', content: '你是资深网文审校编辑。对章节做多维度审查：1)逻辑漏洞（前后矛盾、因果断裂）2)人设崩塌（言行不符性格/说话风格）3)文风一致性 4)节奏问题（拖沓/过急）5)AI腔（排比堆砌、每段总结、滥用"然而/不禁/仿佛/顿时"）。' +
          '规则：只报告、给建议；quote 必须逐字摘自原文（20~40字、选正文中唯一的一段，便于程序定位）；若该处值得直接修改，给出 replacement（用于替换 quote 的完整新文本，替换后上下文通顺）；若只是提醒无需替换则不写 replacement。\n' + ctx.text },
        { role: 'user', content: '章节《' + ch.title + '》：\n"""\n' + ch.content.slice(0, 12000) + '\n"""\n输出：{"issues":[{"dimension":"逻辑|人设|文风|节奏|AI腔","quote":"逐字原文摘录","analysis":"问题分析","suggestion":"修改建议","replacement":"建议替换后的文本(可选)"}]}，没有就输出 {"issues":[]}。' }
      ]);
      const issues = (data.issues || []).filter(i => i && i.analysis);
      if (!issues.length) {
        await logAdd('审校', '《' + ch.title + '》审校通过，无问题');
        toast('审校通过：未发现明显问题', 'ok');
        return;
      }
      this.setBusy(false); // AI 识别已完成，面板展示阶段解除 busy，面板内操作（发送到 AI 助手等）可用
      // 报告面板：可勾选多条，支持「综合修改」或「发送到 AI 助手」；也可单条「用这条替换」
      const body = el('div', {});
      const collectChecked = () => issues.filter((it, i) => {
        const cb = body.querySelector('.rv-chk[data-i="' + i + '"]');
        return cb ? cb.checked : false;
      });
      const renderIssues = () => {
        body.innerHTML = '';
        // 操作区（多选采纳 → 综合修改 / 发送到 AI 助手）
        body.appendChild(el('div', { style: 'display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap' },
          el('span', { id: 'review-progress', class: 'muted', style: 'flex:1;min-width:140px' }),
          el('button', { id: 'rv-combine', class: 'btn small primary', text: '🤖 综合修改已采纳', onclick: async () => {
            const picked = collectChecked();
            if (!picked.length) { toast('请先勾选要采纳的建议', 'err'); return; }
            await this.combineAccepted(picked);
          } }),
          el('button', { id: 'rv-send', class: 'btn small', text: '📤 发送到 AI 助手', onclick: async () => {
            const picked = collectChecked();
            if (!picked.length) { toast('请先勾选要采纳的建议', 'err'); return; }
            await this.sendAcceptedToAI(picked);
          } })
        ));
        let canApply = 0;
        issues.forEach((it, idx) => {
          if (it.replacement && it.replacement.trim()) canApply++;
          body.appendChild(el('div', { class: 'issue ' + (it.dimension === 'AI腔' ? 'low' : 'med') },
            el('div', { style: 'display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap' },
              el('div', { style: 'display:flex;gap:8px;align-items:center' },
                el('input', { type: 'checkbox', class: 'rv-chk', 'data-i': idx, style: 'width:18px;height:18px;accent-color:var(--accent)', onchange: () => updateBar() }),
                el('b', { text: '[' + (it.dimension || '问题') + ']' + (it.applied ? ' ✅已替换' : '') })
              ),
              el('div', { style: 'display:flex;gap:6px' },
                it.replacement && it.replacement.trim() && !it.applied ? el('button', { class: 'btn small primary', text: '✅ 用这条替换', onclick: async (e) => {
                  const ok2 = await this.applyReplacement(it);
                  if (ok2) { it.applied = true; renderIssues(); }
                } }) : null,
                el('button', { class: 'btn small danger', text: '✗ 忽略', onclick: (e) => { e.target.closest('.issue').remove(); } })
              )
            ),
            it.quote ? el('div', { class: 'q', text: '原文：' + it.quote }) : null,
            it.replacement && it.replacement.trim() ? el('div', { class: 'q', style: 'border-left-color:#5aa469', text: '替换为：' + it.replacement }) : null,
            el('div', { style: 'margin-top:6px;font-size:14px;line-height:1.7', text: it.analysis }),
            it.suggestion ? el('div', { class: 'muted', style: 'margin-top:6px', text: '建议：' + it.suggestion }) : null
          ));
        });
        updateBar();
      };
      const updateBar = () => {
        const n = collectChecked().length;
        const bar = body.querySelector('#review-progress');
        if (bar) bar.textContent = n > 0 ? `☑ 已采纳 ${n} 条 → 可「🤖 综合修改」或「📤 发送到 AI 助手」` : (canApplyTotal() ? '💡 可勾选多条后「综合修改」，或单条点「用这条替换」（自动存档可撤销）' : '以上为建议，可勾选后「发送到 AI 助手」讨论');
        const b1 = body.querySelector('#rv-combine'), b2 = body.querySelector('#rv-send');
        if (b1) b1.disabled = n === 0;
        if (b2) b2.disabled = n === 0;
      };
      let canApplyTotal = () => issues.filter(i => i.replacement && i.replacement.trim()).length;
      renderIssues();
      await modal({ title: '🔍 全文审校 · 《' + ch.title + '》', body, okText: '关闭', cancelable: false });
      await logAdd('审校', '《' + ch.title + '》审校完成，' + issues.length + ' 条建议' + (issues.filter(i => i.applied).length ? '，应用替换 ' + issues.filter(i => i.applied).length + ' 处' : ''));
    } catch (e) {
      toast('审校失败：' + e.message, 'err');
    }
    this.setBusy(false);
  },

  /* 🤖 综合修改已采纳：AI 汇总勾选建议 → 输出最终替换对 → 预览逐条确认应用 */
  async combineAccepted(picked) {
    this.setBusy(true);
    toast('🤖 AI 正在综合修改建议…', 'info');
    try {
      const ch = await this.getCur();
      if (!ch) return;
      const ctx = await AI.projectContext({ chapterId: ch.id });
      const advice = picked.map((it, i) => `${i + 1}. [${it.dimension || '问题'}] 原文「${it.quote || ''}」 分析：${it.analysis || ''}${it.suggestion ? ' 建议：' + it.suggestion : ''}${it.replacement ? ' 参考替换：「' + it.replacement + '」' : ''}`).join('\n');
      const data = await AI.json([
        { role: 'system', content: '你是资深网文修改编辑。根据用户采纳的多条审校建议，综合当前章节上下文，给出最终的修改替换对。要求：quote 必须逐字摘自原文（选正文中唯一片段，20~50字）；replacement 为修改后的新文本；同一处多条建议合并成一条；替换后全文通顺、符合人设与文风。只输出 JSON。\n' + ctx.text },
        { role: 'user', content: '章节《' + ch.title + '》末尾：\n……' + (ch.content || '').slice(-2500) + '\n\n采纳的建议：\n' + advice + '\n输出：{"replacements":[{"quote":"原文逐字","replacement":"新文本"}]}' }
      ]);
      const reps = (data.replacements || []).filter(r => r && r.quote && r.replacement);
      if (!reps.length) { toast('AI 未给出可应用的修改', 'err'); return; }
      await this.showCombinePreview(reps);
    } catch (e) {
      toast('综合修改失败：' + e.message, 'err');
    }
    this.setBusy(false);
  },

  /* 综合修改预览：逐条确认应用（快照可回滚） */
  async showCombinePreview(reps) {
    const body = el('div', {});
    let done = 0;
    const render = () => {
      body.innerHTML = '';
      reps.forEach((r, idx) => {
        if (r.applied) return;
        body.appendChild(el('div', { class: 'issue med' },
          el('div', { class: 'q', text: '原文：' + r.quote }),
          el('div', { class: 'q', style: 'border-left-color:#5aa469', text: '替换为：' + r.replacement }),
          el('div', { style: 'display:flex;gap:6px;margin-top:8px' },
            el('button', { class: 'btn small primary', text: '✅ 应用这条', onclick: async (e) => {
              const ok2 = await this.applyReplacement(r);
              if (ok2) { r.applied = true; done++; render(); }
            } }),
            el('button', { class: 'btn small danger', text: '✗ 跳过', onclick: (e) => { r.applied = true; done++; render(); } })
          )
        ));
      });
      const bar = $('#cmp-progress');
      if (bar) bar.textContent = done >= reps.length ? '✅ 已全部处理' : `剩余 ${reps.length - done} 条（点「应用这条」生效，可↩撤销）`;
    };
    body.appendChild(el('div', { id: 'cmp-progress', class: 'muted', style: 'margin-bottom:6px' }));
    render();
    await modal({ title: '🤖 综合修改预览（逐条确认）', body, okText: '关闭', cancelable: false });
    if (done) await logAdd('审校', '综合修改应用 ' + done + ' 处');
  },

  /* 📤 发送到 AI 助手：把采纳的建议汇总成消息发到对话，继续沟通修改 */
  async sendAcceptedToAI(picked) {
    const text = '（全文审校采纳）以下是我从审校中采纳的建议，请帮我逐条落实修改，可以综合优化，改完给出可直接插入的文本：\n' +
      picked.map((it, i) => `${i + 1}. [${it.dimension || '问题'}] 原文：${it.quote || ''}；分析：${it.analysis || ''}${it.suggestion ? '；建议：' + it.suggestion : ''}${it.replacement ? '；参考替换：' + it.replacement : ''}`).join('\n');
    await this.chatAsk(text, { kind: 'chat', label: '审校修改' });
  },

  /* 应用单条替换（用户看中哪条用哪条）：快照 → 定位原文 → 替换 */
  async applyReplacement(it) {
    const ch = await this.getCur();
    if (!ch) return false;
    const quote = it.quote || '';
    const rep = (it.replacement || '').trim();
    if (!quote || !rep) return false;
    const idx = ch.content.indexOf(quote);
    if (idx === -1) {
      toast('未能在正文中找到该原文片段（可能已被改动），请手动修改：「' + quote.slice(0, 15) + '…」', 'err');
      return false;
    }
    ch.snapshots = ch.snapshots || [];
    ch.snapshots.push({ time: Date.now(), content: ch.content });
    if (ch.snapshots.length > 15) ch.snapshots.shift();
    ch.content = ch.content.slice(0, idx) + rep + ch.content.slice(idx + quote.length);
    ch.updatedAt = Date.now();
    await dbPut('chapters', ch);
    await logAdd('审校', '应用替换（' + it.dimension + '）：「' + quote.slice(0, 12) + '…」');
    this.renderEditor(ch);
    this.refreshList();
    toast('已替换（可点「↩ 撤销」回滚）', 'ok');
    return true;
  },

  /* 立即保存当前编辑内容（发消息/识别/审校前调用，保证 AI 读到最新正文） */
  async flushSave() {
    if (!this.curId) return;
    const c = this.c;
    const ta = $('#chap-content', c);
    const title = $('#chap-title', c);
    if (!ta) return;
    const ch = await this.getCur();
    if (!ch) return;
    const patch = {};
    if (ta.value !== ch.content) patch.content = ta.value;
    if (title && title.value !== ch.title) patch.title = title.value;
    if (Object.keys(patch).length) await this.saveCur(patch);
  },

  async buildUserContext() {
    const ctx = await AI.projectContext({ chapterId: this.curId });
    let body = ctx.text;
    // 把当前章节正文尾部带给 AI（实时感知用户写了什么）
    if (ctx.chapter) {
      const content = ctx.chapter.content || '';
      body += '\n\n【当前章节正文】《' + (ctx.chapter.title || '未命名') + '》\n' +
        (content ? '……' + content.slice(-4000) : '（本章还没有正文，从开头写起）');
    }
    return '你是资深网文写作助手。写作要求：文笔流畅，避免 AI 腔（不堆排比、不每段总结、少用"然而/不禁/仿佛"）。' +
      '人设铁律：所有人物言行必须严格符合其【人物卡】中的性格与说话风格，人设崩塌是严重错误；除非用户明确要求，否则不得改变任何人设。' +
      '铁律：绝不修改用户已写内容，只在你被要求的范围内输出。\n\n以下是你的项目记忆与当前正文：\n' + body;
  },

  async chatAsk(text, meta = { kind: 'chat' }) {
    if (this.busy) return;
    await this.flushSave(); // 确保 AI 读到最新正文
    const chat = await dbGet('chat', 'chat') || { id: 'chat', messages: [] };
    const silent = !!meta.silentUser; // 换一版等：不重复显示用户消息
    if (!silent) {
      chat.messages.push({ role: 'user', content: text, ts: Date.now() });
      await dbPut('chat', chat);
    }
    this.renderChat();
    const sys = await this.buildUserContext();
    const hist = chat.messages.slice(-10).map(m => ({ role: m.role === 'assistant' ? 'assistant' : 'user', content: m.content }));
    if (silent) hist.push({ role: 'user', content: text }); // 本次指令作为最新输入
    this.setBusy(true);
    try {
      const reply = await AI.chat([{ role: 'system', content: sys }, ...hist]);
      chat.messages.push({ role: 'assistant', content: reply, ts: Date.now(), meta: { ...meta, reqText: text } });
      await dbPut('chat', chat);
      await logAdd('AI对话', (meta.kind === 'chat' ? '对话：' : meta.label || '生成') + text.slice(0, 30));
    } catch (e) {
      chat.messages.push({ role: 'assistant', content: '⚠️ ' + e.message, ts: Date.now(), meta: { err: true } });
      await dbPut('chat', chat);
      toast(e.message, 'err');
    }
    this.setBusy(false);
    this.renderChat();
  },

  /* 🔄 换一版：静默重发原要求，明确要求生成不同版本（不重复显示用户消息） */
  async regenerate(meta) {
    const req = meta.reqText || '';
    const text = '（换一版）请基于刚才同一个要求，重新生成一版新的内容：角度、表达、细节与上一版明显不同，风格一致且符合人设；不要复述我的要求，直接输出新内容。\n原要求：' + req;
    await this.chatAsk(text, { ...meta, silentUser: true, label: '换一版' });
  },

  /* 💡 灵感：AI 基于当前章节+设定生成剧情灵感，可用/可收藏 */
  async getIdeas() {
    if (this.busy) return;
    const ch = await this.getCur();
    await this.flushSave();
    this.setBusy(true);
    toast('💡 AI 正在生成灵感…', 'info');
    try {
      const ctx = await AI.projectContext({ chapterId: this.curId });
      const data = await AI.json([
        { role: 'system', content: '你是网文剧情灵感策划。基于当前章节与设定，给出具体可用的创作灵感：剧情走向、冲突爆发、伏笔回收、角色互动、金手指升级、反转、新场景等。每条要具体（谁+做了什么+引发什么），不要空泛套话。\n' + ctx.text },
        { role: 'user', content: '当前章节《' + (ch ? ch.title : '') + '》末尾：\n' + (ch ? (ch.content || '').slice(-1500) : '（无正文）') + '\n输出：{"ideas":[{"type":"剧情走向|冲突|伏笔|人物互动|金手指|反转|场景","title":"一句话标题","content":"具体灵感描述(50字左右)"}]}，6~8 条。' }
      ]);
      const ideas = (data.ideas || []).filter(i => i && i.content);
      if (!ideas.length) { toast('未生成有效灵感，请重试', 'err'); return; }
      await this.showIdeas(ideas);
    } catch (e) {
      toast('灵感生成失败：' + e.message, 'err');
    }
    this.setBusy(false);
  },

  async showIdeas(ideas) {
    const saved = JSON.parse(localStorage.getItem('workbench_ideas') || '[]');
    const body = el('div', {});
    const renderIdeas = () => {
      body.innerHTML = '';
      body.appendChild(el('div', { class: 'muted', style: 'margin-bottom:8px', text: '⭐ 已收藏 ' + saved.length + ' 条灵感（收藏存在本机）。「✍️ 使用」= 让 AI 按这条灵感直接写。' }));
      ideas.forEach((it, idx) => {
        body.appendChild(el('div', { style: 'display:flex;gap:8px;align-items:flex-start;padding:8px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;flex-wrap:wrap;background:var(--bg)' },
          el('div', { style: 'flex:1;min-width:160px' },
            el('div', { style: 'font-weight:700;font-size:13px', text: '[' + (it.type || '灵感') + '] ' + (it.title || '') }),
            el('div', { style: 'font-size:13px;line-height:1.6;margin-top:4px', text: it.content })
          ),
          el('button', { class: 'btn small primary', text: '✍️ 使用', onclick: async () => {
            await this.chatAsk('（灵感写作）请根据这条灵感写一段，延续当前章节：' + (it.type || '') + '｜' + (it.title || '') + '：' + it.content, { kind: 'chat', label: '灵感写作' });
          } }),
          el('button', { class: 'btn small', text: '⭐ 收藏', onclick: () => {
            if (!saved.some(x => x.title === it.title && x.content === it.content)) {
              saved.push({ type: it.type, title: it.title, content: it.content, at: Date.now() });
              localStorage.setItem('workbench_ideas', JSON.stringify(saved));
            }
            toast('已收藏', 'ok');
            renderIdeas();
          } })
        ));
      });
    };
    renderIdeas();
    await modal({ title: '💡 灵感池', body, okText: '关闭', cancelable: false });
  },

  /* 续写（不选中任何内容时，AI 只能在文末续写） */
  async continueWrite() {
    const ch = await this.getCur();
    if (!ch) return;
    if (ch.locked) { toast('本章已锁定，无法续写', 'err'); return; }
    const tail = (ch.content || '').slice(-300);
    const text = `接着我的小说《${ch.title}》继续往下写（只能续写，不能改动我已有的内容），300~500 字，保持现有风格和视角。\n当前文末：${tail ? '……' + tail : '（本章还没有正文，请从开头写起）'}`;
    await this.chatAsk(text, { kind: 'cont', label: '续写' });
  },

  /* 🧠 章节识别：AI 识别人物/势力/关系 → 面板逐条确认 → 确认后自动更新 */
  async analyzeChapter() {
    const ch = await this.getCur();
    if (!ch) return;
    if (ch.locked) { toast('本章已锁定，请先解锁再识别', 'err'); return; }
    await this.flushSave(); // 先保存最新正文再识别
    this.setBusy(true);

      this.addTextItem('', { x: Math.max(0.1, Math.min(0.9, (e.clientX - r.left) / r.width)), y: Math.max(0.12, Math.min(0.88, (e.clientY - r.top) / r.height)) });
    });
  },

  async saveMap() { this.map.textMap = this.textMap; await dbPut('maps', this.map); },

  setZoom(z) {
    this.zoom = Math.max(0.6, Math.min(3.2, z));
    if (this._view) this._view.style.transform = `scale(${this.zoom})`;
    const v = $('#m-zoomv', this.c);
    if (v) v.textContent = Math.round(this.zoom * 100) + '%';
  },

  /* ===== 势力树（belong 名称关联） ===== */
  forest() {
    const items = this.textMap.items || [];
    const byName = {};
    for (const it of items) byName[it.name] = it;
    const roots = [];
    for (const it of items) {
      if (this.LINE_TYPES.includes(it.type)) { roots.push({ it, kids: [] }); continue; }
      const p = it.belong ? byName[it.belong] : null;
      if (p && !this.LINE_TYPES.includes(p.type)) {
        p._kids = p._kids || [];
        // 找/建父节点
        let pn = null;
        for (const r of roots) if (r.it === p) { pn = r; break; }
        if (!pn) { pn = { it: p, kids: [] }; roots.push(pn); }
        if (!pn.kids.some(k => k.it === it)) pn.kids.push({ it, kids: [] });
      } else if (!p) roots.push({ it, kids: [] });
    }
    // 清掉临时标记
    for (const it of items) delete it._kids;
    return roots;
  },

  /* ===== 布局计算（0~1 坐标） ===== */
  layout(nodes) {
    const out = [];
    const areaSize = (it, kidCount) => {
      const base = it.type === '州郡' ? 0.09 : it.type === '蛮荒' ? 0.12 : it.type === '国家' ? 0.135 : 0.085;
      const k = Math.min(2.4, 1 + kidCount * 0.16);
      const r = Math.min(0.24, base * k);
      return { rx: r, ry: r * 0.78 };
    };
    const place = (node, x, y, slot) => {
      const it = node.it;
      if (this.LINE_TYPES.includes(it.type)) {
        out.push({ it, kind: 'line' });
        return; // 线型无子项
      }
      // 顶层或独立项：x,y 直接用或 zone 落位
      const isRoot = (slot === undefined);
      let cx = x, cy = y;
      if (isRoot) {
        cx = typeof it.x === 'number' ? it.x : (this.ZONE_POS[it.zone] || [0.5, 0.5])[0] + (Math.random() - 0.5) * 0.05;
        cy = typeof it.y === 'number' ? it.y : (this.ZONE_POS[it.zone] || [0.5, 0.5])[1] + (Math.random() - 0.5) * 0.05;
        it.x = Math.round(cx * 100) / 100; it.y = Math.round(cy * 100) / 100;
      }
      const kids = node.kids.filter(k => !this.LINE_TYPES.includes(k.it.type));
      const sz = this.AREA_TYPES.includes(it.type) ? areaSize(it, kids.length) : { rx: 0, ry: 0 };
      const isArea = this.AREA_TYPES.includes(it.type);
      out.push({ it, kind: isArea ? 'area' : 'point', x: cx, y: cy, rx: sz.rx, ry: sz.ry });
      if (isArea && kids.length) {
        const n = kids.length;
        kids.forEach((kid, i) => {
          const kkind = this.AREA_TYPES.includes(kid.it.type) ? 0 : 1; // 范围子项靠外环，点靠内
          const offA = kkind === 0 ? 0.6 : 0.44;
          const ang = -Math.PI / 2 + (i / n) * Math.PI * 2 + 0.35; // 整圆均布
          place(kid, cx + Math.cos(ang) * sz.rx * offA, cy + Math.sin(ang) * sz.ry * offA, 1);
        });
      } else if (!isArea && node.kids.length) {
        node.kids.forEach(kid => place(kid, cx, cy, 1));
      }
    };
    for (const n of nodes) place(n, null, null, undefined);
    // 去重保护：同 item 只输出一次
    const seen = new Set();
    return out.filter(o => (seen.has(o.it.id) ? false : (seen.add(o.it.id), true)));
  },

  /* ===== 渲染 ===== */
  renderBoard() {
    const board = $('#m-board', this.c);
    if (!board) return;
    const W = board.clientWidth || 900, H = board.clientHeight || 560;
    board.innerHTML = '';
    const view = el('div', { class: 'map-view', style: `transform:scale(${this.zoom})` });
    this._view = view;
    board.appendChild(view);
    const SVGNS = 'http://www.w3.org/2000/svg';
    const items = this.textMap.items || [];
    const base = this.baseImage;
    if (base) {
      view.appendChild(el('img', { class: 'map-baseimg', src: base.dataUrl }));
    } else {
      const contSvg = document.createElementNS(SVGNS, 'svg');
      contSvg.setAttribute('class', 'map-continent');
      contSvg.setAttribute('viewBox', '0 0 1 1');
      contSvg.setAttribute('preserveAspectRatio', 'none');
      const cont = document.createElementNS(SVGNS, 'path');
      cont.setAttribute('d', this.blobPath(0.5, 0.5, 0.46, 0.46, 'continent-1'));
      cont.setAttribute('class', 'continent');
      contSvg.appendChild(cont);
      const shore = document.createElementNS(SVGNS, 'path');
      shore.setAttribute('d', this.blobPath(0.5, 0.5, 0.465, 0.465, 'shore-2'));
      shore.setAttribute('class', 'continent-shore');
      contSvg.appendChild(shore);
      view.appendChild(contSvg);
    }
    for (const [ch, x, y] of this.DIRS) view.appendChild(el('span', { class: 'dir', style: `left:${x * 100}%;top:${y * 100}%`, text: ch }));
    view.appendChild(el('div', { class: 'map-title', text: '🗺 世界格局' }));
    view.appendChild(this.compassEl());
    view.appendChild(this.legendEl());
    $('#m-nobg', this.c).hidden = !base;
    if (!items.length) {
      view.appendChild(el('div', { class: 'map-empty', text: '🖊️ 空白大陆\n· 点「＋ 新增」放国家/州郡/城市/山河\n· 或「🤖 AI 自动生成」按你的世界观与势力层级一键成图\n· 或「🎨 AI 底图」先生成一张写实地形底图\n· 滚轮/双指放大缩小 · 点大陆空白处 = 在点击处新增' }));
      return;
    }
    const nodeBase = this.forest();
    const laid = this.layout(nodeBase);
    if (base) {
      // 底图模式：AI 地形 + 虚线国界 + 地名
      const terrSvg = document.createElementNS(SVGNS, 'svg');
      terrSvg.setAttribute('class', 'map-territories');
      terrSvg.setAttribute('viewBox', '0 0 1 1');
      terrSvg.setAttribute('preserveAspectRatio', 'none');
      view.appendChild(terrSvg);
      const areas = laid.filter(o => o.kind === 'area').sort((a, b) => (b.rx * b.ry) - (a.rx * a.ry));
      for (const o of areas) this.renderBaseArea(terrSvg, view, o);
      for (const o of laid.filter(o => o.kind === 'point')) this.renderPoint(view, o, W, H);
      const lineNames = (this.textMap.items || []).filter(it => this.LINE_TYPES.includes(it.type) && it.name && it.sx !== undefined);
      for (const it of lineNames) this.renderLineLabel(view, it, W, H);
      return;
    }
    // 代码模式：虚线领土圈 + 山河线
    const terrSvg = document.createElementNS(SVGNS, 'svg');
    terrSvg.setAttribute('class', 'map-territories');
    terrSvg.setAttribute('viewBox', '0 0 1 1');
    terrSvg.setAttribute('preserveAspectRatio', 'none');
    view.appendChild(terrSvg);
    const svg = el('svg', { class: 'map-lines', viewBox: '0 0 1 1', preserveAspectRatio: 'none' });
    const lineItems = items.filter(it => this.LINE_TYPES.includes(it.type));
    lineItems.forEach(it => { if (!it.sx && typeof it.sx !== 'number') this.defaultLine(it); });
    for (const it of lineItems) this.drawLine(svg, it, W, H);
    view.appendChild(svg);
    const areas = laid.filter(o => o.kind === 'area').sort((a, b) => (b.rx * b.ry) - (a.rx * a.ry));
    for (const o of areas) this.renderArea(terrSvg, view, o, W, H);
    for (const o of laid.filter(o => o.kind === 'point')) this.renderPoint(view, o, W, H);
    const lineNames = lineItems.filter(it => it.name && it.sx !== undefined);
    for (const it of lineNames) this.renderLineLabel(view, it, W, H);
  },

  /* 底图模式下：虚线国界 + 竖排国名 */
  renderBaseArea(terrSvg, container, o) {
    const it = o.it;
    const SVGNS = 'http://www.w3.org/2000/svg';
    const g = document.createElementNS(SVGNS, 'g');
    g.setAttribute('transform', `translate(${o.x.toFixed(4)} ${o.y.toFixed(4)})`);
    const path = document.createElementNS(SVGNS, 'path');
    path.setAttribute('d', this.irregularPath(o.rx, o.ry, it.id || it.name + '_dash'));
    path.setAttribute('class', 'terr-dash');
    path.style.cursor = 'grab';
    g.appendChild(path);
    terrSvg.appendChild(g);
    const name = el('span', { class: 'terr-name', style: `left:${o.x * 100}%;top:${o.y * 100}%`, text: it.name, title: (it.desc || '') + '拖动调整 · 点击编辑' });
    container.appendChild(name);
    const bindDrag = (el2) => {
      el2.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        const mb = $('#m-board', this.c);
        const r = mb.getBoundingClientRect();
        const st = { x: e.clientX, y: e.clientY, ox: o.x, oy: o.y, moved: false };
        const move = (ev) => {
          const dx = ev.clientX - st.x, dy = ev.clientY - st.y;
          if (!st.moved && Math.hypot(dx, dy) > 5) st.moved = true;
          if (!st.moved) return;
          o.x = Math.max(0.04, Math.min(0.96, st.ox + dx / this.zoom / r.width));
          o.y = Math.max(0.05, Math.min(0.95, st.oy + dy / this.zoom / r.height));
          g.setAttribute('transform', `translate(${o.x.toFixed(4)} ${o.y.toFixed(4)})`);
          name.style.left = (o.x * 100) + '%'; name.style.top = (o.y * 100) + '%';
        };
        const up = async () => {
          window.removeEventListener('pointermove', move);
          window.removeEventListener('pointerup', up);
          if (st.moved) { it.x = Math.round(o.x * 100) / 100; it.y = Math.round(o.y * 100) / 100; await this.saveMap(); }
          else this.editTextItem(it);
        };
        window.addEventListener('pointermove', move);
        window.addEventListener('pointerup', up);
      });
    };
    bindDrag(path);
    bindDrag(name);
  },

  /* 平滑不规则闭合轮廓（大陆/领土通用） */
  blobPath(cx, cy, rx, ry, seedStr) {
    const N = 18;
    let s = 13;
    const str = String(seedStr || '');
    for (let k = 0; k < str.length; k++) s = (s * 31 + str.charCodeAt(k)) >>> 0;
    const rnd = () => { s = (s * 1103515245 + 12345) >>> 0; return s / 4294967296; };
    const pts = [];
    for (let i = 0; i < N; i++) {
      const a = (i / N) * Math.PI * 2;
      const rr = 1 + (rnd() - 0.5) * 0.3;
      pts.push([cx + Math.cos(a) * rx * rr, cy + Math.sin(a) * ry * rr]);
    }
    const mids = pts.map((p, i) => { const pn = pts[(i + 1) % N]; return [(p[0] + pn[0]) / 2, (p[1] + pn[1]) / 2]; });
    let d = `M${mids[0][0].toFixed(4)},${mids[0][1].toFixed(4)}`;
    for (let i = 0; i < N; i++) {
      const c = pts[(i + 1) % N], m2 = mids[(i + 1) % N];
      d += ` Q${c[0].toFixed(4)},${c[1].toFixed(4)} ${m2[0].toFixed(4)},${m2[1].toFixed(4)}`;
    }
    return d + ' Z';
  },

  compassEl() {
    const d = document.createElement('div');
    d.className = 'map-compass';
    d.innerHTML = `<svg width="56" height="56" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="47" fill="rgba(250,244,226,.78)" stroke="#6b4f2a" stroke-width="2"/>
      <circle cx="50" cy="50" r="37" fill="none" stroke="#6b4f2a" stroke-width="1" opacity=".45"/>
      <g stroke="#6b4f2a" stroke-width="2.4" stroke-linecap="round">
        <line x1="50" y1="7" x2="50" y2="25"/><line x1="50" y1="75" x2="50" y2="93"/>
        <line x1="7" y1="50" x2="25" y2="50"/><line x1="75" y1="50" x2="93" y2="50"/>
      </g>
      <g stroke="#6b4f2a" stroke-width="1.4" opacity=".6">
        <line x1="18" y1="18" x2="31" y2="31"/><line x1="69" y1="69" x2="82" y2="82"/>
        <line x1="18" y1="82" x2="31" y2="69"/><line x1="69" y1="31" x2="82" y2="18"/>
      </g>
      <polygon points="50,5 45,21 55,21" fill="#a8542a"/>
      <text x="50" y="46" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a3015">北</text>
    </svg>`;
    return d;
  },

  legendEl() {
    const d = document.createElement('div');
    d.className = 'map-legend';
    d.innerHTML = `<b>图 例</b>
      <div class="lg"><svg viewBox="0 0 34 10"><rect x="1" y="1.5" width="32" height="7" fill="rgba(255,252,240,.5)" stroke="#6b4f2a" stroke-width="1.8"/></svg>国家 · 领地</div>
      <div class="lg"><svg viewBox="0 0 34 10"><path d="M0,7 L5,3 L10,7 L15,3 L20,7 L25,3 L30,7 L34,4" fill="none" stroke="#4a4034" stroke-width="1.7"/></svg>山脉</div>
      <div class="lg"><svg viewBox="0 0 34 10"><path d="M0,8 Q9,1 17,6 T34,4" fill="none" stroke="#3a4a55" stroke-width="1.8"/></svg>河流</div>
      <div class="lg"><span style="font-size:14px;font-weight:700;color:#5a3d1f">城 都</span>都城 · 州郡</div>`;
    return d;
  },

  /* 由种子生成不规则手绘轮廓 path（中心 0,0，外接 rx/ry） */
  irregularPath(rx, ry, seedStr) {
    const N = 16;
    let s = 7;
    const str = String(seedStr || 'seed');
    for (let k = 0; k < str.length; k++) s = (s * 31 + str.charCodeAt(k)) >>> 0;
    const rnd = () => { s = (s * 1103515245 + 12345) >>> 0; return s / 4294967296; };
    const pts = [];
    for (let i = 0; i < N; i++) {
      const a = (i / N) * Math.PI * 2;
      const rr = 1 + (rnd() - 0.5) * 0.5; // 0.75 ~ 1.25
      pts.push([Math.cos(a) * rx * rr, Math.sin(a) * ry * rr]);
    }
    const mids = pts.map((p, i) => {
      const pn = pts[(i + 1) % N];
      return [(p[0] + pn[0]) / 2, (p[1] + pn[1]) / 2];
    });
    let d = `M${mids[0][0].toFixed(4)},${mids[0][1].toFixed(4)}`;
    for (let i = 0; i < N; i++) {
      const c = pts[(i + 1) % N], m2 = mids[(i + 1) % N];
      d += ` Q${c[0].toFixed(4)},${c[1].toFixed(4)} ${m2[0].toFixed(4)},${m2[1].toFixed(4)}`;
    }
    return d + ' Z';
  },

  defaultLine(it) {
    // 默认：山脉/河流按 between 或 zone 生成两端点
    const mk = (a, b) => {
      const za = this.ZONE_POS[a] || [0.3, 0.3], zb = this.ZONE_POS[b] || [0.7, 0.7];
      return { sx: za[0], sy: za[1], ex: zb[0], ey: zb[1] };
    };
    if (it.between && it.between.includes('-')) {
      const [a, b] = it.between.split('-').map(s => s.trim());
      const pa = this.findNamed(a), pb = this.findNamed(b);
      const p1 = pa ? { x: pa.x, y: pa.y } : this.ZONE_POS[a];
      const p2 = pb ? { x: pb.x, y: pb.y } : this.ZONE_POS[b];
      if (p1 && p2) { it.sx = p1.x; it.sy = p1.y; it.ex = p2.x; it.ey = p2.y; return; }
    }
    const c = this.ZONE_POS[it.zone] || [0.5, 0.45];
    const horiz = it.type === '河流' ? true : (it.desc || '').includes('横贯') ? true : !(it.desc || '').includes('纵贯') && Math.random() < 0.5;
    const L = 0.22;
    it.sx = c[0] - (horiz ? L / 2 : 0); it.sy = c[1] - (horiz ? 0 : L / 2);
    it.ex = c[0] + (horiz ? L / 2 : 0); it.ey = c[1] + (horiz ? 0 : L / 2);
  },
  findNamed(name) {
    const it = (this.textMap.items || []).find(x => x.name === name);
    return it && (typeof it.x === 'number') ? it : null;
  },

  drawLine(svg, it, W, H) {
    const mkPt = (px, py) => [px * W, py * H];
    let d = '';
    if (it.type === '山脉') {
      // 锯齿折线
      const [x1, y1] = mkPt(it.sx, it.sy), [x2, y2] = mkPt(it.ex, it.ey);
      const seg = 5; const pts = [[x1, y1]];
      for (let i = 1; i < seg; i++) {
        const t = i / seg;
        const nx = x1 + (x2 - x1) * t, ny = y1 + (y2 - y1) * t;
        const perp = (i % 2 === 1 ? 1 : -1) * Math.min(7, Math.hypot(x2 - x1, y2 - y1) * 0.12);
        const ang = Math.atan2(y2 - y1, x2 - x1) + Math.PI / 2;
        pts.push([nx + Math.cos(ang) * perp, ny + Math.sin(ang) * perp]);
      }
      pts.push([x2, y2]);
      d = 'M' + pts.map(p => p.map(v => v.toFixed(1)).join(',')).join(' L');
    } else {
      // 曲线（河流/水域边线）
      const [x1, y1] = mkPt(it.sx, it.sy), [x2, y2] = mkPt(it.ex, it.ey);
      const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
      const dx = x2 - x1, dy = y2 - y1;
      const len = Math.hypot(dx, dy) || 1;
      const cx = mx - dy / len * len * 0.18, cy = my + dx / len * len * 0.18;
      d = `M${x1.toFixed(1)},${y1.toFixed(1)} Q${cx.toFixed(1)},${cy.toFixed(1)} ${x2.toFixed(1)},${y2.toFixed(1)}`;
    }
    const path = el('path', { d, fill: 'none', class: 'ln ' + (it.type === '山脉' ? 'ln-mtn' : 'ln-riv'), 'stroke-width': 1 });
    if (it.type === '山脉') path.setAttribute('stroke-width', 2.4); else path.setAttribute('stroke-width', 3);
    svg.appendChild(path);
    // 端点手柄（拖动）
    this.lineHandle(svg, it, 's');
    this.lineHandle(svg, it, 'e');
  },
  lineHandle(svg, it, end) {
    const x = end === 's' ? it.sx : it.ex, y = end === 's' ? it.sy : it.ey;
    const h = el('circle', { cx: x, cy: y, r: 0.014, class: 'ln-handle' });
    h.dataset.line = it.id; h.dataset.end = end;
    h.style.cursor = 'move';
    h.addEventListener('pointerdown', (e) => {
      e.preventDefault(); e.stopPropagation();
      const board = $('#m-board', this.c);
      const r = board.getBoundingClientRect();
      const st = { x: e.clientX, y: e.clientY, sx: it.sx, sy: it.sy, ex: it.ex, ey: it.ey };
      const mv = (ev) => {
        const z = this.zoom;
        const nx = Math.max(0.02, Math.min(0.98, st.sx + (ev.clientX - st.x) / z / r.width));
        const ny = Math.max(0.02, Math.min(0.98, st.sy + (ev.clientY - st.y) / z / r.height));
        if (end === 's') { it.sx = nx; it.sy = ny; }
        else { it.ex = nx; it.ey = ny; }
        this.renderBoard();
      };
      const up = async () => { window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', up); await this.saveMap(); };
      window.addEventListener('pointermove', mv);
      window.addEventListener('pointerup', up);
    });
    svg.appendChild(h);
  },

  renderArea(terrSvg, board, o, W, H) {
    const it = o.it;
    const SVGNS = 'http://www.w3.org/2000/svg';
    const g = document.createElementNS(SVGNS, 'g');
    g.setAttribute('transform', `translate(${o.x.toFixed(4)} ${o.y.toFixed(4)})`);
    const path = document.createElementNS(SVGNS, 'path');
    path.setAttribute('d', this.irregularPath(o.rx, o.ry, it.id || it.name));
    path.setAttribute('class', 'terr terr-' + it.type);
    path.style.cursor = 'grab';
    g.appendChild(path);
    terrSvg.appendChild(g);
    // 名称标签
    const name = el('span', {
      class: 'terr-name', style: `left:${o.x * 100}%;top:${o.y * 100}%`, text: it.name,
      title: (it.desc || '') + '\n拖动调整位置 · 点击编辑'
    });
    board.appendChild(name);
    // 拖拽/点击（拖动整体平移形状与名称；点击=编辑）
    const bindDrag = (el2) => {
      el2.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        const r = $('#m-board', this.c).getBoundingClientRect();
        const st = { x: e.clientX, y: e.clientY, ox: o.x, oy: o.y, moved: false };
        const move = (ev) => {
          const dx = ev.clientX - st.x, dy = ev.clientY - st.y;
          if (!st.moved && Math.hypot(dx, dy) > 5) st.moved = true;
          if (!st.moved) return;
          o.x = Math.max(0.05, Math.min(0.95, st.ox + dx / this.zoom / r.width));
          o.y = Math.max(0.05, Math.min(0.95, st.oy + dy / this.zoom / r.height));
          g.setAttribute('transform', `translate(${o.x.toFixed(4)} ${o.y.toFixed(4)})`);
          name.style.left = (o.x * 100) + '%'; name.style.top = (o.y * 100) + '%';
        };
        const up = async () => {

      await this.run([ch]);
    };
    $('#d-all', c).onclick = async () => {
      const chapters = await dbAll('chapters');
      if (!chapters.length) { toast('还没有章节', 'err'); return; }
      await this.run(chapters);
    };
    $('#d-log-clear', c).onclick = async () => {
      if (!(await confirmDlg('清空操作日志？'))) return;
      await dbClear('log');
      this.renderLog();
    };
    await this.renderIssues();
    await this.renderLog();
  },
  async focus() { await this.renderIssues(); await this.renderLog(); },

  /* 分批检测 */
  async run(chapters) {
    const ctx = await AI.projectContext();
    const sys = '你是小说一致性审校员。对照【世界观设定】与【人物卡】，检查正文中的设定错误与前后矛盾（如：身高/年龄/时间线/地名/能力前后不一致，或与设定库冲突）。' +
      '同时检查【人设崩塌】：人物言行是否符合其【人物卡】中的性格与说话风格（如活泼的人被写得沉默寡言）。' +
      '铁律：只报告，绝不修改任何文本。\n' + ctx.text;
    const prog = $('#d-progress', this.c);
    const chunks = [];
    let cur = [], len = 0;
    for (const ch of chapters) {
      const text = '【' + ch.title + '】\n' + (ch.content || '');
      if (len + text.length > 25000 && cur.length) { chunks.push(cur); cur = []; len = 0; }
      cur.push(text); len += text.length;
    }
    if (cur.length) chunks.push(cur);
    const found = [];
    for (let i = 0; i < chunks.length; i++) {
      prog.textContent = `⏳ 正在检查第 ${i + 1}/${chunks.length} 批…`;
      const user = '以下是待检查的小说正文：\n"""\n' + chunks[i].join('\n\n') + '\n"""\n' +
        '输出：{"issues":[{"confidence":"high|med|low","chapter":"所在章节名","quote":"矛盾原文摘录(20字内)","analysis":"为什么是矛盾","suggestion":"建议改法"}]}。没有矛盾就输出 {"issues":[]}。';
      try {
        const data = await AI.json([{ role: 'system', content: sys }, { role: 'user', content: user }]);
        for (const it of (data.issues || [])) {
          if (!it.analysis) continue;
          found.push({
            id: uid(), time: Date.now(), confidence: it.confidence || 'med',
            chapter: it.chapter || '', quote: it.quote || '', analysis: it.analysis,
            suggestion: it.suggestion || '', status: 'open'
          });
        }
      } catch (e) {
        toast('第 ' + (i + 1) + ' 批检测失败：' + e.message, 'err');
      }
    }
    prog.textContent = '';
    this.issues = [...found, ...this.issues];
    this.saveIssues();
    await logAdd('检测', '完成一次一致性检查，发现 ' + found.length + ' 处问题');
    toast('检测完成：发现 ' + found.length + ' 处可能问题', found.length ? 'err' : 'ok');
    this.renderIssues();
  },

  renderIssues() {
    const box = $('#d-list', this.c);
    box.innerHTML = '';
    const open = this.issues.filter(i => i.status === 'open');
    if (!open.length) {
      box.innerHTML = '<div class="empty-tip">暂无未处理的问题。点「检查当前章节」或「检查全书」开始检测。</div>';
      return;
    }
    for (const it of open) {
      const cls = it.confidence === 'high' ? 'high' : it.confidence === 'low' ? 'low' : 'med';
      box.appendChild(el('div', { class: 'issue ' + cls },
        el('div', { style: 'display:flex;gap:8px;align-items:center;flex-wrap:wrap' },
          el('b', { text: ({ high: '⚠️ [高置信]', med: '⚠️ [中置信]', low: 'ℹ️ [低置信]' })[it.confidence] || '⚠️' }),
          el('span', { class: 'count', text: it.chapter || '未知章节' })
        ),
        el('div', { style: 'margin-top:6px;font-size:14px;line-height:1.7', text: it.analysis }),
        it.quote ? el('div', { class: 'q', text: '原文：' + it.quote }) : null,
        it.suggestion ? el('div', { class: 'muted', text: '建议：' + it.suggestion }) : null,
        el('div', { class: 'acts' },
          el('button', { class: 'btn small primary', text: '📍 定位到章节', onclick: async () => {
            if (it.chapter) {
              const chapters = await dbAll('chapters');
              const ch = chapters.find(x => x.title === it.chapter);
              if (ch) {
                await Writing.open(ch.id);
                App.navTo('writing');
                toast('已打开章节「' + ch.title + '」，找到问题位置后自行修改（AI 不会替你改）', 'ok');
                return;
              }
            }
            App.navTo('writing');
          } }),
          el('button', { class: 'btn small', text: '✅ 我已处理', onclick: async () => {
            it.status = 'fixed';
            this.saveIssues();
            await logAdd('检测', '问题已处理：' + it.analysis.slice(0, 30));
            this.renderIssues();
          } }),
          el('button', { class: 'btn small', text: '🙈 忽略（误报）', onclick: async () => {
            it.status = 'ignored';
            this.saveIssues();
            this.renderIssues();
          } })
        )
      ));
    }
  },

  async renderLog() {
    const box = $('#d-log', this.c);
    const logs = await dbAll('log');
    logs.sort((a, b) => b.time - a.time);
    box.innerHTML = '';
    if (!logs.length) { box.innerHTML = '<div class="muted">暂无操作记录。AI 的每一次行为（生成/采纳/识别/检测/改名…）都会记录在这里。</div>'; return; }
    const TAG = { 'AI对话': '🤖', '采纳': '✅', '章节': '📖', '人物': '👥', '世界观': '🌍', '宗门': '🏯', '地图': '🗺️', '检测': '🔍', '设置': '⚙️', '数据': '📦', '撤销': '↩' };
    for (const l of logs.slice(0, 100)) {
      box.appendChild(el('div', { class: 'log-item' },
        el('span', { class: 't', text: new Date(l.time).toLocaleString('zh-CN', { hour12: false }) }),
        el('span', { class: 'tag', text: (TAG[l.type] || '·') + ' ' + l.type }),
        el('span', { class: 'd', text: l.desc })
      ));
    }
    if (logs.length > 100) box.appendChild(el('div', { class: 'muted', style: 'padding:8px', text: '（仅显示最近 100 条）' }));
  }
};

PageMods.detect = Detect;

;
;App.boot();
</script>
</body>
</html>
