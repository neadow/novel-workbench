        el('div', { class: 'title', html: `${it.core ? '🔒 ' : ''}[${esc(it.category)}] ${esc(it.title || '未命名')}${it.parent ? ` <span style="color:#c98b4b;font-weight:400;font-size:12px">↳ 上级：${esc(it.parent)}</span>` : ''}${it.core ? ' <span class="core-badge" style="color:#a8542a;font-weight:400;font-size:12px">核心铁律</span>' : ''}${it.source ? ' <span style="color:#999;font-weight:400;font-size:11px">📥来源锁定</span>' : ''}` }),
        el('div', { class: 'content', text: it.content || '（空）' }),
        el('div', { style: 'display:flex;gap:8px;margin-top:8px' },
          el('button', { class: 'btn small', text: '✏️ 编辑', onclick: () => this.editItem(it) }),
          el('button', { class: 'btn small danger', text: '🗑', onclick: async () => {
            if (!(await confirmDlg('删除设定「' + it.title + '」' + (it.source ? '（该条来自导入文档）' : '') + '？'))) return;
            rec.items = rec.items.filter(x => x !== it);
            await dbPut('world', rec);
            await logAdd('世界观', '删除设定「' + it.title + '」');
            this.render();
          } })
        )
      ));
    }
  },

  /* 世界观对话上下文：全部设定（含势力条目层级，地理=category:'地理' 设定）+ 人物（AI 生成不冲突） */
  async worldContext() {
    const rec = await getWorldRec();
    const chars = await dbAll('characters');
    const lines = [];
    lines.push('【当前世界观设定】');
    lines.push(rec.items.length ? rec.items.map(it => `- [${it.category}] ${it.title}${it.parent ? '（上级：' + it.parent + '）' : ''}${it.core ? '（🔒核心）' : ''}：${(it.content || '').slice(0, 120)}`).join('\n') : '（暂无）');
    lines.push('\n【人物】' + (chars.length ? chars.map(x => x.name).join('、') : '（暂无）'));
    const fLines = await worldFactionLines();
    lines.push('【势力组织（设定层级）】' + (fLines.startsWith('（暂无') ? fLines : fLines.replace(/\n/g, ' / ')));
    return lines.join('\n');
  },

  /* 世界观 AI 对话（独立记录 worldchat，不影响写作对话） */
  async worldChatAsk(text, meta = {}) {
    if (this.busy) return;
    const chat = await dbGet('chat', 'worldchat') || { id: 'worldchat', messages: [] };
    chat.messages.push({ role: 'user', content: text, ts: Date.now() });
    await dbPut('chat', chat);
    this.renderWorldChat();
    const ctx = await this.worldContext();
    const sys = '你是小说世界观构建助手。与用户沟通完善世界观设定：帮助细化体系、规划势力格局、设计地理布局、补充时间线等。' +
      '要求：与已有设定自洽不冲突；若用户要求生成/更新设定，可用【设定草案】格式给出（见生成设定草案按钮）。\n当前世界观状态：\n' + ctx;
    const hist = chat.messages.slice(-10).map(m => ({ role: m.role === 'assistant' ? 'assistant' : 'user', content: m.content }));
    this.busy = true;
    try {
      const reply = await AI.chat([{ role: 'system', content: sys }, ...hist]);
      chat.messages.push({ role: 'assistant', content: reply, ts: Date.now(), meta: { ...meta, reqText: text } });
      await dbPut('chat', chat);
      await logAdd('世界观', '世界观AI对话：' + text.slice(0, 30));
    } catch (e) {
      chat.messages.push({ role: 'assistant', content: '⚠️ ' + e.message, ts: Date.now(), meta: { err: true } });
      await dbPut('chat', chat);
      toast(e.message, 'err');
    }
    this.busy = false;
    this.renderWorldChat();
  },

  async renderWorldChat() {
    const chat = await dbGet('chat', 'worldchat') || { id: 'worldchat', messages: [] };
    const box = $('#world-chat-box', this.c);
    if (!box) return;
    box.innerHTML = '';
    if (!chat.messages.length) {
      box.innerHTML = '<div class="empty-tip">和世界观 AI 沟通：<br>· 聊设定细节（"境界体系怎么分层合理？"）<br>· 规划势力格局（"北方魏国，下设兖州等州郡"）<br>· 设计地理（"横断山脉隔开齐楚"）<br>· AI 回答你认可的，点「⭐ 认可」，再点「🤖 生成设定草案」只按认可的内容入库</div>';
      return;
    }
    const approvedCount = chat.messages.filter(m => m.role === 'assistant' && m.meta && m.meta.approved).length;
    if (approvedCount) box.appendChild(el('div', { class: 'muted', style: 'padding:6px 12px;font-size:12px', text: '✅ 已认可 ' + approvedCount + ' 条 AI 回答 → 点「🤖 生成设定草案」将只按这些内容入库' }));
    for (const m of chat.messages) {
      const div = el('div', { class: 'msg ' + (m.role === 'user' ? 'user' : 'ai') });
      div.textContent = m.content;
      if (m.role === 'assistant' && !(m.meta && m.meta.err)) {
        const approved = !!(m.meta && m.meta.approved);
        div.appendChild(el('div', { class: 'acts' },
          el('button', { class: 'btn small' + (approved ? ' primary' : ''), text: approved ? '✅ 已认可（点此取消）' : '⭐ 认可这条', title: '标记这条 AI 回答为你认可的设定，生成草案时优先采用', onclick: async () => {
            m.meta = m.meta || {};
            m.meta.approved = !m.meta.approved;
            await dbPut('chat', chat);
            this.renderWorldChat();
          } })
        ));
      }
      div.appendChild(el('div', { class: 'meta', text: new Date(m.ts || Date.now()).toLocaleTimeString('zh-CN', { hour12: false }) }));
      box.appendChild(div);
    }
    box.scrollTop = box.scrollHeight;
  },

  /* 🤖 生成设定草案：基于「认可的 AI 回复」（无认可则按最近对话）+ 现有设定 → 结构化草案（含势力层级）→ 逐条确认采纳 */
  async generateDraft() {
    if (this.busy) { toast('AI 处理中…', 'info'); return; }
    const chat = await dbGet('chat', 'worldchat') || { id: 'worldchat', messages: [] };
    const ctx = await this.worldContext();
    // 收集被认可的 AI 回复（连同对应的用户提问，便于理解上下文）
    const approved = chat.messages.filter(m => m.role === 'assistant' && m.meta && m.meta.approved && !m.meta.err);
    let basis;
    if (approved.length) {
      const lines = [];
      for (let i = 0; i < chat.messages.length; i++) {
        const m = chat.messages[i];
        if (m.role === 'assistant' && m.meta && m.meta.approved && !m.meta.err) {
          // 往前找对应的用户提问（最近一条用户消息）
          let ask = '';
          for (let j = i - 1; j >= 0; j--) { if (chat.messages[j].role === 'user') { ask = chat.messages[j].content.slice(0, 200); break; } }
          lines.push((ask ? '【我的提问】' + ask + '\n' : '') + '【认可的 AI 回答】' + m.content);
        }
      }
      basis = '以下是我认可的对话内容，请严格基于这些整理设定（不要引入认可内容之外的设想）：\n' + lines.join('\n\n');
    } else {
      basis = '最近对话：\n' + chat.messages.slice(-8).map(m => (m.role === 'user' ? '我：' : 'AI：') + m.content.slice(0, 300)).join('\n');
    }
    this.busy = true;
    toast('🤖 AI 正在整理设定草案…', 'info');
    try {
      const data = await AI.json([
        { role: 'system', content: '你是小说世界观设定编辑。根据对话内容整理出需要新增/更新的设定条目。特别要求识别「势力结构」：如果对话里有「魏国下面几个省市」「魏国→兖州→许都」这类层级关系（国家→州郡→城市，或宗门→分堂→据点等），要生成带 parent 的势力条目链，例如：{"category":"势力","title":"魏国","parent":""} → {"category":"势力","title":"兖州","parent":"魏国"} → {"category":"势力","title":"许都","parent":"兖州"}。parent 填父条目标题（父级也应是本批条目或已有设定），无父级则留空。其他分类的设定如需层级同样用 parent。只输出 JSON。\n当前世界观状态：\n' + ctx },
        { role: 'user', content: basis + '\n输出：{"items":[{"category":"境界体系|功法|势力|金手指|时间线|地理|其他","title":"设定名","content":"设定内容(详细)","parent":"父条目标题(无则空)"}]}，3~10 条。' }
      ]);
      const items = (data.items || []).filter(i => i && i.title && i.content);
      if (!items.length) { toast('未整理出有效草案', 'err'); return; }
      await this.showDraftPanel(items);
    } catch (e) {
      toast('生成草案失败：' + e.message, 'err');
    }
    this.busy = false;
  },

  /* 草案确认面板：逐条采纳/忽略/修改（含上级）→ 写入世界观库（势力条目即设定，供人物隶属与 AI 上下文复用） */
  async showDraftPanel(items) {
    const pending = items.slice();
    let done = 0, adopted = 0;
    const body = el('div', {});
    const renderList = () => {
      body.innerHTML = '';
      let left = 0;
      pending.forEach((it, idx) => {
        if (it._gone) return;
        left++;
        body.appendChild(el('div', { style: 'display:flex;gap:8px;align-items:flex-start;padding:8px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;flex-wrap:wrap;background:var(--bg)' },
          el('div', { style: 'flex:1;min-width:160px' },
            el('div', { style: 'font-weight:700;font-size:13px', text: '[' + (it.category || '设定') + '] ' + it.title + (it.parent ? ' <span style="color:#c98b4b;font-weight:400">↳ 属于 ' + esc(it.parent) + '</span>' : '') }),
            el('div', { style: 'font-size:13px;line-height:1.6;margin-top:4px', text: it.content })
          ),
          el('button', { class: 'btn small primary', text: '✅ 采纳', onclick: async () => {
            await this.adoptItem(it);
            it._gone = true; done++; adopted++;
            renderList();
          } }),
          el('button', { class: 'btn small', text: '✗ 忽略', onclick: async () => { it._gone = true; done++; renderList(); } }),
          el('button', { class: 'btn small', text: '✏️ 修改', onclick: async () => {
            const t = await promptDlg('修改设定标题', it.title);
            if (t) it.title = t;
            const c = await textareaDlg('修改设定内容', it.content);
            if (c) it.content = c;
            const p = await promptDlg('上级条目（势力层级用，如：魏国；留空为顶层）', it.parent || '');
            if (p !== null) it.parent = p;
            renderList();
          } })
        ));
      });
      const bar = $('#draft-progress');
      if (bar) bar.textContent = left ? `⏳ 剩余 ${left} 条（采纳后自动入库；势力条目带层级，可直接用于人物隶属与 AI 上下文）` : '✅ 已全部处理';
    };
    body.appendChild(el('div', { id: 'draft-progress', class: 'muted', style: 'margin-bottom:8px' }));
    renderList();
    await modal({ title: '🤖 设定草案确认', body, okText: '完成', cancelable: false });
    if (adopted) {
      await logAdd('世界观', '草案采纳 ' + adopted + ' 条设定');
      toast('已入库 ' + adopted + ' 条设定，势力结构已同步', 'ok');
    }
  },

  async adoptItem(it) {
    const rec = await getWorldRec();
    const parent = (it.parent || '').trim();
    const existing = rec.items.find(x => x.title === it.title && x.category === it.category);
    if (existing) {
      // 保护铁律：来自「导入设定文档」的条目是基调，AI 草案不得覆盖（用户可手动编辑）
      if (existing.source === '设定文档' && it.content !== existing.content) {
        toast('「' + existing.title + '」来自导入的设定文档（基调已锁定），草案不覆盖。如需修改请在世界观页手动编辑该条', 'err');
        return false;
      }
      existing.content = it.content;
      existing.parent = parent;
      existing.updatedAt = Date.now();
    } else {
      rec.items.push({ id: uid(), category: it.category || '其他', title: it.title, content: it.content, parent, updatedAt: Date.now() });
    }
    await dbPut('world', rec);
    return true;
  },

  /* ========== 📥 导入设定文档：原文只读存档 → AI 切分命名 → 程序按锚点截原文 → 逐条确认入库 ========== */

  /* 弹窗收集设定文档（粘贴或选文件） */
  async importDocStart() {
    const ta = el('textarea', { class: 'input', style: 'width:100%;min-height:150px', placeholder: '在此粘贴设定文档全文（txt/md 均可）…' });
    const fileBtn = el('button', { class: 'btn small', text: '📂 或选择 .txt / .md 文件' });
    fileBtn.onclick = async () => {
      const f = await filePicker('.txt,.md,.text');
      if (!f) return;
      try { ta.value = await f.text(); toast('已读取「' + (f.name || '') + '」(' + wordCount(ta.value) + ' 字)，可点「开始导入」', 'ok'); }
      catch (e) { toast('读取文件失败：' + e.message, 'err'); }
    };
    const nameInp = el('input', { class: 'input', style: 'width:100%', placeholder: '文档名称（可留空，默认取首行或“设定文档”）' });
    const hint = el('div', { class: 'muted', style: 'line-height:1.7;font-size:12.5px', html:
      '导入流程：<b>① 原文一字不改只读存档</b>（可随时「查看原文」）→ <b>② AI 只负责切分与命名</b>（正文由程序按锚点从原文<b>逐字截取</b>，AI 不生成、不改写任何正文）→ <b>③ 逐条确认</b>后入库。<br>' +
      '🔒 = 该条建议标记为<b>核心铁律</b>（写作纠错时重点遵守）；AI 也会识别势力层级（parent）。<br>' +
      '⚠️ 长文档会分块处理，<b>2 万字约需 5~15 分钟</b>，期间请保持页面打开（可看到进度）。' });
    const body = el('div', { style: 'display:flex;flex-direction:column;gap:10px' },
      el('div', {}, el('div', { class: 'muted', text: '名称（可选）' }), nameInp),
      el('div', {}, el('div', { class: 'muted', text: '设定文档内容' }), fileBtn, ta),
      hint
    );
    const ok = await modal({ title: '📥 导入设定文档', body, okText: '🚀 开始导入', cancelText: '取消' });
    if (!ok) return;
    const raw = ta.value.trim();
    if (wordCount(raw) < 200) { toast('内容太短（<200 字），请粘贴完整设定文档', 'err'); return; }
    // AI 连通预检：配置缺失/跨域/Key 错误在导入前就明确提示，避免用户等十几分钟后才发现全失败
    try {
      await AI.test();
    } catch (e) {
      const msg = e.message || 'AI 连接失败';
      const body2 = el('div', { style: 'line-height:1.9' },
        el('p', { html: '<b>⚠️ AI 连接不可用，无法开始切分：</b>' + esc(msg) }),
        el('ul', { style: 'padding-left:18px;font-size:13px' },
          el('li', {}, '先到「设置 → AI 接口配置」填 baseURL / API Key / 模型，点「测试连接」'),
          el('li', {}, '若是跨域(CORS)错误：请用「启动电脑版.bat」起本地服务器，再到设置勾选「本地代理模式」后重试'),
          el('li', {}, 'Key 无效或额度不足也会导致失败，请核对')
        )
      );
      await modal({ title: '⚠️ 导入前检查：AI 不可用', body: body2, okText: '去设置页', cancelText: '取消' }).then(goto => {
        if (goto) App.navTo('settings');
      });
      return;
    }
    const name = nameInp.value.trim() || this.guessDocName(raw);
    await this.importDocRun(raw, name);
  },

  guessDocName(raw) {
    const first = raw.split(/\r?\n/).map(s => s.trim()).find(s => s && s.length < 40);
    return (first || '设定文档').slice(0, 30);
  },

  /* 程序化粗分块：优先按“标题行/短句行”分段；超长段落按中文标点切成 ≤3400 字小块（同标题后缀序号）。
     块不宜过碎（每块一次 AI 调用），单块 ≤3400 字 + max_tokens 8192 足够提炼且不截断 */
  splitDocBlocks(raw) {
    const lines = raw.split(/\r?\n/);
    const blocks = [];
    let section = '';   // 当前节标题（无标题则为 ''）
    let buf = '';       // 当前块缓冲
    const SEG_MAX = 3400;
    const isHeading = (t) => t && t.length <= 40 && /[：:]$/.test(t) && !/[，。；,!?？]/.test(t);
    const flush = () => {
      if (buf.trim()) blocks.push({ title: section, text: buf.trim() });
      buf = '';
    };
    for (const rawLine of lines) {
      const t = rawLine.trim();
      if (!t) continue;
      if (isHeading(t)) {
        flush();
        section = t.replace(/[：:]$/, '').trim();
      } else if (t.length > 3800) {
        // 超长单行：贪心切块（句号优先、超过 SEG_MAX 强制切、绝不丢内容）
        flush();
        const out = [];
        let seg = '';
        for (const ch of t) {
          seg += ch;
          const hard = seg.length >= SEG_MAX - 400;
          if (/[。！？]/.test(ch) || hard) { out.push(seg); seg = ''; }
        }
        if (seg) out.push(seg);
        for (const p of out) { if (p && p.trim()) blocks.push({ title: section, text: p.trim() }); }
      } else {
        if (buf && buf.length + t.length > SEG_MAX) flush();
        buf += t + '\n';
      }
    }
    flush();
    if (!blocks.length) blocks.push({ title: '', text: raw });
    // 命名与消重：无标题 → 继承上一节标题（续）；同名小节追加序号（2）（3）
    const used = {};
    for (let i = 0; i < blocks.length; i++) {
      const b = blocks[i];
      let t = b.title;
      if (!t) {
        const prev = i > 0 ? blocks[i - 1].title : '';
        t = (prev && !/（\d+）$/.test(prev) ? prev : '') || '设定部分';
      }
      const base = t.replace(/（\d+）$/, '');
      const n = (used[base] = (used[base] || 0) + 1);
      b.title = base + (n > 1 ? '（' + n + '）' : '');
    }
    return blocks;
  },

  /* 导入进度浮层（固定提示条，长任务可见） */
  impStatus(text, pct) {
    let el0 = $('#imp-status');
    if (!el0) {
      el0 = document.createElement('div');
      el0.id = 'imp-status';
      el0.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:9999;background:rgba(40,30,18,.92);color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;line-height:1.7;max-width:86vw;box-shadow:0 4px 20px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:6px;align-items:center';
      document.body.appendChild(el0);
    }
    el0.innerHTML = text;
    if (typeof pct === 'number') {
      const bar = el0.appendChild(document.createElement('div'));
      bar.style.cssText = 'height:6px;width:100%;min-width:260px;background:rgba(255,255,255,.2);border-radius:3px;overflow:hidden';
      const fill = bar.appendChild(document.createElement('div'));
      fill.style.cssText = `height:100%;width:${Math.max(2, Math.min(100, pct))}%;background:#7ec67e;transition:width .4s`;
    }
  },
  impStatusClear() { const el0 = $('#imp-status'); if (el0) el0.remove(); },

  /* 执行导入：存入文档库（docLib）→ 设为默认档 → 逐块提炼（失败自动重试并记录原因）→ 补漏 → 确认入库 */
  async importDocRun(raw, name) {
    if (this.busy) { toast('AI 处理中，请稍候', 'info'); return; }
    const rec = await getWorldRec();
    // 原文存档到「设定文档库」：每次导入都保留；新导入的设为默认档（cur，供查阅/引原文）
    const blocks = this.splitDocBlocks(raw);
    const libId = uid();
    rec.docLib = rec.docLib || [];
    rec.docLib = rec.docLib.map(d => ({ ...d, cur: false })); // 旧档取消默认标记
    rec.docLib.unshift({ id: libId, name, text: raw, importedAt: Date.now(), cur: true });
    const doc = { name, text: raw, blocks, importedAt: Date.now(), libId };
    rec.doc = doc;
    await dbPut('world', rec);
    await logAdd('世界观', '导入设定文档「' + name + '」存入设定文档库（' + wordCount(raw) + ' 字，' + blocks.length + ' 块）');
    // 逐块提炼
    this.busy = true;
    const pending = [];   // 每块返回的候选项
    const fails = [];     // {title, err}
    const realBlocks = blocks.filter(b => b.text.trim());
    let blockNo = 0;
    this.impStatus(`📥 已存档原文，准备切分 <b>${esc(name)}</b>（${realBlocks.length} 块，约需 5~15 分钟）…`, 1);
    try {
      for (let i = 0; i < realBlocks.length; i++) {
        const b = realBlocks[i];
        blockNo++;
        const pct = Math.round(blockNo / realBlocks.length * 100);
        this.impStatus(`⏳ 切分 ${blockNo}/${realBlocks.length}：「${esc(b.title || '（未命名）')}」…<br><small>已成功 ${pending.length} 条 · ${pct}%</small>`, pct);
        let items = null;
        let lastErr = '';
        try { items = await this.extractBlock(b, realBlocks, i, pending); }
        catch (e) { lastErr = e.message; }
        if ((!items || !items.length) && !lastErr) { try { items = await this.extractBlock(b, realBlocks, i, pending); } catch (e) { lastErr = e.message; } }
        if (items && items.length) { for (const it of items) { it.fromBlock = b.title; pending.push(it); } }
        else { fails.push({ title: b.title || '（未命名块）', err: lastErr || 'AI 未给出有效结构/锚点' }); }
      }
      // 补漏自检（最多补 5 条，失败不阻塞）
      try {
        const missing = await this.findMissingTopics(raw, pending);
        const useful = Array.isArray(missing) ? missing.slice(0, 5) : [];
        if (useful.length) {
          this.impStatus(`🔍 发现 ${useful.length} 个可能遗漏的主题，正在补充…`, 96);
          for (const m of useful) {
            try {
              const it = await this.extractMissingTopic(m, raw, pending);
              if (it) pending.push(it);
            } catch (e) { /* 忽略 */ }
          }
        }
      } catch (e) { /* 补漏失败不影响主流程 */ }
    } finally {
      this.busy = false;
      this.impStatusClear();
    }
    const items = pending.filter(it => it && it.title && (it.content || '').length >= 6);
    if (!items.length) {
      // 全部失败：明确告诉用户原因与排查方向，而不是静默
      const reasons = fails.length ? [...new Set(fails.map(f => f.err || '未知错误'))].join('\n· ') : '';
      const body = el('div', { style: 'line-height:1.8' },
        el('p', {}, '本轮未能切分出任何设定条目，请检查：'),
        el('ul', { style: 'padding-left:18px' },
          el('li', {}, '设置页 AI 接口是否已配置并「测试连接」成功？（导入前已预检，若仍失败多为网络波动）'),
          el('li', {}, '浏览器直连被跨域拦截时，需用「启动电脑版.bat」并在设置页勾选「本地代理模式」'),
          el('li', {}, '模型上下文/输出较短（如 max_tokens 小的免费模型）时建议换 deepseek-chat'),
          el('li', {}, '网络波动可稍后重试；已存档的原文不会丢失，重试会从存档继续')
        ),
        reasons ? el('div', { style: 'margin-top:10px;padding:8px;background:var(--bg);border-radius:8px;font-size:12.5px;color:var(--danger)', html: '<b>失败详情：</b><br>· ' + esc(reasons) }) : null
      );
      await modal({ title: '⚠️ 设定切分失败', body, okText: '我知道了', cancelable: false });
      toast('导入失败：请检查 AI 配置后重试（原文已存档不丢失）', 'err');
      return;
    }
    await this.importConfirmPanel(items, name, fails.map(f => ({ title: f.title, err: f.err })), realBlocks.length - fails.length, realBlocks.length);
  },

  /* 提炼单个文本块（锚点直引模式）：AI 不生成正文，只做切分/命名/分类/🔒/层级，
     并为每条输出 anchor=该主题在【块内容】中起始处的原文片段（逐字 6~24 字）；
     程序按 anchor 位置把原文块切成段落作为条目 content —— 保证正文 100% 是原文逐字，AI 无法概括/篡改。 */
  async extractBlock(b, blocks, idx, alreadyPending, force = false) {
    const rec = await getWorldRec();
    const knownTitles = [...rec.items.map(x => x.title), ...alreadyPending.map(x => x.title)].filter(Boolean);
    const sys = '你是小说世界观设定文档的结构化切分器。用户把设定文档切成文本块，你的任务是为当前块做「切分索引」，不要生成任何正文。' +
      '铁律：1) 【绝不输出条目正文】——正文会由程序按你的 anchor 从原文逐字截取，你只需描述结构；' +
      '2) 把块内并列的主题切成独立条目（如一个块讲了魏国/齐国/赵国 → 每条一国）；' +
      '3) 每条给出 anchor：该主题在【块内容】中起始处的原文片段，必须【逐字】复制块内 6~24 个字符（不可增删改、不可用标题代替），用于程序定位切分起点；' +
      '4) 识别势力层级：国家/宗门/州郡用 parent 填直接上级（如 许都→兖州→魏国）；5) 分类限：境界体系|功法|势力|地理|时间线|金手指|其他；' +
      '6) core=true 表示“核心铁律”——绝对不可违背的规则（境界划分、元素生克、寿命、功法构成规则、国策基调等），普通描述性内容 false；' +
      '7) 与已入库条目标题重复的主题不要生成；8) 整块若只讲一个主题，输出 1 条，anchor 用块开头 6~12 字。' +
      '\n已入库条目标题（不要重复生成）：' + (knownTitles.join('、').slice(0, 800) || '（无）');
    const user = '块标题：' + (b.title || '') + '\n块内容：\n"""\n' + b.text + '\n"""\n' +
      '输出：{"items":[{"category":"分类","title":"条目名","anchor":"块内原文起始片段(逐字6~24字，仅此一条用于定位)","parent":"直接上级(无则空)","core":true或false}]}，通常 1~8 条；没有新主题输出 {"items":[]}。';
    const data = await AI.json([{ role: 'system', content: sys }, { role: 'user', content: user }]);
    const raws = Array.isArray(data.items) ? data.items.filter(i => i && i.title) : [];
    if (!raws.length) return [];
    return this.cutByAnchors(b.text, raws, b.title);
  },

  /* 锚点切分：按 anchor 在块原文中的位置把块切段——每条 content = 上一锚点到下一锚点之间的原文（逐字）。
     首条从块首起算（保留前导说明不丢字）；找不到锚点时整块作一条兜底；保证内容不丢、不改写。 */
  cutByAnchors(text, raws, blockTitle) {
    const located = [];
    for (const r of raws) {
      let a = String(r.anchor || '').trim().replace(/^["'“”「『]+|["'”」』]+$/g, '');
      if (!a) continue;
      const pos = text.indexOf(a);
      if (pos === -1) continue; // 锚点不在块内 → 该结构项无法定位，跳过（其区域由相邻切分覆盖，正文不丢）
      located.push({ r, pos, anchor: a });
    }
    if (!located.length) {
      // 兜底：整块作为一条，正文=整块原文
      const base = raws[0] || {};
      return [{
        category: base.category || '其他',
        title: base.title || (blockTitle || '未命名'),
        content: text.trim(),
        parent: (base.parent || '').trim(),
        core: !!base.core
      }];
    }
    located.sort((x, y) => x.pos - y.pos);
    const out = [];
    for (let i = 0; i < located.length; i++) {
      const cur = located[i];
      const start = i === 0 ? 0 : cur.pos;                       // 首条含块首前导，内容不丢
      const end = i + 1 < located.length ? located[i + 1].pos : text.length;
      const content = text.slice(start, end).trim();
      if (!content) continue;
      out.push({
        category: cur.r.category || '其他',
        title: cur.r.title || (blockTitle || '未命名'),
        content,
        parent: (cur.r.parent || '').trim(),
        core: !!cur.r.core,
        quoteStart: start, quoteEnd: end
      });
    }
    return out;
  },

  /* 补漏自检：全文对照已提炼标题，找可能遗漏主题 */
  async findMissingTopics(raw, pending) {
    try {
      const rec = await getWorldRec();
      const titles = [...rec.items.map(x => x.title), ...pending.map(x => x.title)].filter(Boolean);
      const data = await AI.json([
        { role: 'system', content: '你是设定编辑校对员。下面有一份设定文档与“已提炼条目标题”。请找出文档中明显存在、但标题清单里没有覆盖的主题（如：某个国家的教育制度、某套境界规则、某功法体系的构成规则等）。只报确实存在的遗漏；宁可少报，不要臆造。只输出 JSON。' },
        { role: 'user', content: '已提炼条目标题：' + (titles.join('、') || '（无）') + '\n\n原文（长度 ' + wordCount(raw) + ' 字）：\n"""\n' + raw.slice(0, 16000) + '\n"""\n输出：{"missing":[{"topic":"遗漏主题的一句话标题"}]}，没有遗漏输出 {"missing":[]}。' }
      ]);
      return Array.isArray(data.missing) ? data.missing.filter(m => m && m.topic) : [];
    } catch (e) { return []; }
  },

  /* 针对单个遗漏主题：在原文中定位（anchor 起止），正文=原文逐字截取，不经过 AI 改写 */
  async extractMissingTopic(m, raw, pending) {
    const rec = await getWorldRec();
    const titles = [...rec.items.map(x => x.title), ...pending.map(x => x.title)].filter(Boolean);
    const sys = '你是设定文档校对员。用户认为「' + (m.topic || '某主题') + '」可能被遗漏。请在【原文】中找到该主题对应的那段内容，定位它的起止。' +
      '铁律：不要生成正文——正文会由程序用你的锚点从原文逐字截取。输出 startAnchor 与 endAnchor：两者都必须【逐字】出现在原文中（各 8~30 字），startAnchor 取该主题正文开头、endAnchor 取该主题正文收尾处（含结尾标点）；若原文没有该主题输出 {"empty":true}。只输出 JSON。';
    const user = '原文：\n"""\n' + raw.slice(0, 20000) + '\n"""\n输出：{"title":"条目名","category":"分类","parent":"直接上级(无则空)","core":true或false,"startAnchor":"正文起始原文(逐字)","endAnchor":"正文收尾原文(逐字)"} 或 {"empty":true}';
    const data = await AI.json([{ role: 'system', content: sys }, { role: 'user', content: user }]);
    if (data.empty || !data.title) return null;
    if (titles.includes(data.title)) return null;
    const s = String(data.startAnchor || '').trim();
    const e = String(data.endAnchor || '').trim();
    const si = s ? raw.indexOf(s) : -1;
    let content = '';
    if (si >= 0) {
      const ei = e && e !== s ? raw.indexOf(e, si) : -1;
      const endPos = ei >= 0 ? ei + e.length : Math.min(raw.length, si + 3000);
      content = raw.slice(si, endPos).trim();
    }
    if ((content || '').length < 6) {
      // 锚点定位失败：放弃该条（返回 null，不臆造）
      return null;
    }
    return { title: data.title, category: data.category || '其他', content, parent: data.parent || '', core: !!data.core, fromBlock: m.topic || '补漏' };
  },

  /* 导入确认面板：逐条 采纳/忽略/修改/🔒 标记 → 入库（带 source 锁定标记）
     failMsgs: 失败块数组 [{title,err}]；okBlocks: 成功块数 */
  async importConfirmPanel(items, docName, failMsgs, okBlocks, totalBlocks) {
    const pending = items.slice();
    const stats = { adopted: 0, ignored: 0, kept: 0 };
    const worldRec = await getWorldRec();
    // 同名条目已存在且内容不同 → 冲突（采纳时默认保留现有正文，见 adoptImportItem）
    const conflictOf = (it) => worldRec.items.find(x => x.category === (it.category || '其他') && x.title === it.title && (x.content || '') !== (it.content || ''));
    const body = el('div', {});
    const renderList = () => {
      body.innerHTML = '';
      let left = 0;
      pending.forEach((it, i) => {
        if (it._gone) return;
        left++;
        const cf = conflictOf(it);
        const row = el('div', { style: 'display:flex;gap:8px;align-items:flex-start;padding:9px;border:1px solid var(--line);border-radius:10px;margin-bottom:7px;flex-wrap:wrap;background:var(--bg)' },
          el('div', { style: 'flex:1;min-width:200px' },
            el('div', { style: 'font-weight:700;font-size:13px', html: '[' + esc(it.category || '设定') + '] ' + esc(it.title) + (it.parent ? ' <span style="color:#c98b4b;font-weight:400">↳ 上级：' + esc(it.parent) + '</span>' : '') + (it.core ? ' <span style="color:#a8542a">🔒核心</span>' : '') + (it.fromBlock ? ' <span class="src" style="font-size:11px;color:#999">源自：' + esc(it.fromBlock) + '</span>' : '') }),
            el('div', { style: 'font-size:13px;line-height:1.6;margin-top:4px;max-height:90px;overflow:auto;white-space:pre-wrap', text: it.content }),
            cf ? el('div', { style: 'margin-top:5px;padding:6px 8px;border:1px dashed var(--accent);border-radius:8px;font-size:12px;line-height:1.7;color:var(--ink2)' },
              el('div', { text: '⚠️ 库里已有同名条目[' + (cf.category || '设定') + ']「' + cf.title + '」，内容与本次不同：默认保留现有正文（只更新层级/核心标记）。现有内容：' + (cf.content || '').replace(/\s+/g, ' ').slice(0, 60) + '…' }),
              el('label', { style: 'display:flex;gap:5px;align-items:center;margin-top:4px;color:var(--danger)' },
                el('input', { type: 'checkbox', checked: it._overwrite ? 'checked' : null, style: 'width:15px;height:15px;accent-color:var(--accent)', onchange: (e) => { it._overwrite = e.target.checked; } }),
                '改为用新导入内容覆盖现有正文（你手改过的内容会丢失）'
              )
            ) : null
          ),
          el('button', { class: 'btn small' + (it.core ? ' primary' : ''), text: it.core ? '🔒 核心(点此取消)' : '🔒 标为核心', title: '核心铁律=写作纠错时重点遵守，AI 不得违背', onclick: () => { it.core = !it.core; renderList(); } }),
          el('button', { class: 'btn small primary', text: '✅ 采纳', onclick: async () => { const st = await this.adoptImportItem(it, { overwrite: !!it._overwrite }); if (st === 'kept') stats.kept++; it._gone = true; stats.adopted++; renderList(); } }),
          el('button', { class: 'btn small', text: '✗ 忽略', onclick: () => { it._gone = true; stats.ignored++; renderList(); } }),
          el('button', { class: 'btn small', text: '✏️ 修改', onclick: async () => {
            const cat = await promptDlg('修改分类（境界体系/功法/势力/地理/时间线/金手指/其他）', it.category);
            if (cat) it.category = cat;
            const t = await promptDlg('修改标题', it.title);
            if (t) it.title = t;
            const p = await promptDlg('上级条目（势力层级用；无则留空）', it.parent || '');
            if (p !== null) it.parent = p;
            const cc = await textareaDlg('修改内容（默认忠实原文；如有疑问请核对原文）', it.content);
            if (cc) it.content = cc;
            renderList();
          } })
        );
        body.appendChild(row);
      });
      const bar = $('#imp-progress');
      if (bar) bar.textContent = left ? `⏳ 剩余 ${left} 条（🔒=核心铁律；采纳即入库并锁定来源，AI 后续不得覆盖）` : '✅ 已全部处理';
    };
    body.appendChild(el('div', { style: 'display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;flex-wrap:wrap;gap:6px' },
      el('span', { id: 'imp-progress', class: 'muted' }),
      el('span', { style: 'display:flex;gap:6px;flex-wrap:wrap' },
        el('button', { class: 'btn small', text: '✅ 采纳剩余全部（保原文）', title: '把剩余未处理的候选全部采纳入库（保留 AI 提炼内容；仍可用“修改”回改单条前先看内容）', onclick: async () => {
          for (const it of pending) { if (!it._gone) { const st = await this.adoptImportItem(it, { overwrite: !!it._overwrite }); if (st === 'kept') stats.kept++; it._gone = true; stats.adopted++; } }
          renderList();
        } }),
        el('button', { class: 'btn small', text: '✏️ 全部标为核心', title: '整份设定若希望全文都作为铁律可一键标记（仍可在修改里单独取消）', onclick: () => { pending.forEach(x => { if (!x._gone) x.core = true; }); renderList(); } })
      )
    ));
    if (failMsgs && failMsgs.length) {
      body.appendChild(el('div', { style: 'margin-bottom:8px;padding:8px 10px;background:var(--bg);border:1px solid var(--line);border-radius:10px;font-size:12.5px;color:var(--ink2);line-height:1.7',
        html: '⚠️ 有 ' + failMsgs.length + ' 个块切分失败（共 ' + (totalBlocks || '?') + ' 块，成功 ' + (okBlocks || 0) + ' 块）：' +
          esc(failMsgs.slice(0, 6).map(f => f.title + '（' + (f.err || 'AI 未返回有效内容') + '）').join('；')) +
          (failMsgs.length > 6 ? ' 等 ' + failMsgs.length + ' 个' : '') + '。你可先确认下方成功条目；失败块稍后可在「🤖 世界观 AI」里让 AI 单独补、或手动新增。' }));
    }
    renderList();
    await modal({ title: '📥 导入确认 · ' + docName + '（' + items.length + ' 条候选）', body, okText: '✔ 完成', cancelText: '关闭', cancelable: true });
    if (stats.adopted) {
      await logAdd('世界观', '导入设定确认：采纳 ' + stats.adopted + ' 条' + (stats.kept ? '（其中 ' + stats.kept + ' 条保留现有正文未覆盖）' : '') + (stats.ignored ? '，忽略 ' + stats.ignored + ' 条' : '') + (failMsgs && failMsgs.length ? '（' + failMsgs.length + ' 块失败）' : ''));
      toast('已入库 ' + stats.adopted + ' 条设定（来源已锁定）' + (stats.kept ? '，' + stats.kept + ' 条同名条目保留了原内容' : ''), 'ok');
    }
    this.render();
  },

  /* 采纳单条导入项：写入 world.items，带 source 锁定标记；重复条目不重复建。
     同名条目已存在且内容不同时，默认【保留现有正文】（只更新层级/核心标记），
     只有用户在本面板显式勾选「用新内容覆盖」才覆盖——避免重新导入整份文档时
     把用户手改过的设定静默回滚。（注意：这里不能弹 modal，面板内再弹窗会把当前面板关掉）
     返回 'ok'（新建/覆盖/内容一致）或 'kept'（保留了现有不同内容） */
  async adoptImportItem(it, { overwrite = false } = {}) {
    const rec = await getWorldRec();
    const existing = rec.items.find(x => x.category === (it.category || '其他') && x.title === it.title);
    if (existing) {
      const same = (existing.content || '') === (it.content || '');
      if (!same && overwrite) existing.content = it.content;
      existing.parent = (it.parent || '').trim();
      existing.core = !!it.core;
      if (same || overwrite) existing.source = '设定文档';
      else if (!existing.source) existing.source = '设定文档';
      existing.fromBlock = it.fromBlock || existing.fromBlock;
      existing.updatedAt = Date.now();
      await dbPut('world', rec);
      if (!same && !overwrite) {
        await logAdd('世界观', '导入条目「' + it.title + '」与现有内容不同：保留现有正文，仅更新层级/核心标记');
        return 'kept';
      }
      return 'ok';
    }
    rec.items.push({
      id: uid(), category: it.category || '其他', title: it.title, content: it.content,
      parent: (it.parent || '').trim(), core: !!it.core, source: '设定文档', fromBlock: it.fromBlock || '', updatedAt: Date.now()
    });
    await dbPut('world', rec);
    return 'ok';
  },

  async editItem(item) {
    const isNew = !item;
    const rec = await getWorldRec();
    const catSel = el('select', { class: 'input', style: 'width:100%' });
    for (const cat of this.cats.slice(1)) catSel.appendChild(el('option', { value: cat, text: cat, selected: item && item.category === cat ? 'selected' : null }));
    const titleInp = el('input', { class: 'input', style: 'width:100%', value: item ? item.title : '', placeholder: '设定标题，如：练气九层' });
    // 上级设定（势力层级用）：列出库内其他条目标题
    const parentSel = el('select', { class: 'input', style: 'width:100%' });
    parentSel.appendChild(el('option', { value: '', text: '（无上级 / 顶层）' }));
    for (const x of rec.items) {
      if (item && x === item) continue;
      parentSel.appendChild(el('option', { value: x.title, text: '[' + x.category + '] ' + x.title + (x.parent ? '（上级：' + x.parent + '）' : ''), selected: item && item.parent === x.title ? 'selected' : null }));
    }
    const contInp = el('textarea', { class: 'input', style: 'width:100%;min-height:130px', html: item ? esc(item.content) : '', placeholder: '详细内容…' });

          if (!it.analysis) continue;
          found.push({
            id: uid(), runId, time: Date.now(), confidence: it.confidence || 'med',
            chapter: it.chapter || '', quote: it.quote || '', analysis: it.analysis,
            suggestion: it.suggestion || '', rule: it.rule || '', status: 'open'
          });
        }
      } catch (e) {
        toast('第 ' + (i + 1) + ' 批检测失败：' + e.message, 'err');
      }
    }
    prog.textContent = '';
    // 记录本次批次（用于按次分组展示：本次/上次一目了然）
    const runs = JSON.parse(localStorage.getItem('workbench_runs') || '[]');
    runs.unshift({ id: runId, time: Date.now(), found: found.length, name: chapters.length > 1 ? '全书检测' : '单章检测（' + (chapters[0] && chapters[0].title || '') + '）' });
    if (runs.length > 20) runs.length = 20;
    localStorage.setItem('workbench_runs', JSON.stringify(runs));
    this.issues = [...found, ...this.issues];
    this.saveIssues();
    await logAdd('检测', '完成一次一致性检查，发现 ' + found.length + ' 处问题');
    toast('检测完成：发现 ' + found.length + ' 处可能问题', found.length ? 'err' : 'ok');
    this.renderIssues();
  },

  renderIssues() {
    const box = $('#d-list', this.c);
    box.innerHTML = '';
    if (!this.expandedRuns) this.expandedRuns = new Set();
    const open = this.issues.filter(i => i.status === 'open');
    const runs = JSON.parse(localStorage.getItem('workbench_runs') || '[]');
    if (!open.length) {
      box.innerHTML = '<div class="empty-tip">暂无未处理的问题。点「检查当前章节」或「检查全书」开始检测。</div>';
      if (runs.length) box.appendChild(el('div', { class: 'muted', style: 'margin-top:10px;font-size:12.5px', text: '（历史批次：' + runs.slice(0, 5).map(r => '🕐 ' + new Date(r.time).toLocaleString('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false }) + ' · ' + r.name + ' ' + r.found + ' 条').join('；') + '。清空过或已处理的批次不在此列出。）' }));
      return;
    }
    // 按检测批次分组：本次（最新批次）在前并默认展开；历史批次折叠成一行标题，点击展开
    const groupBy = {};
    for (const it of open) { const k = it.runId || it.time || 'older'; (groupBy[k] = groupBy[k] || []).push(it); }
    const keys = Object.keys(groupBy).sort((a, b) => (b === 'older' ? -1 : (+b || 0)) - (a === 'older' ? -1 : (+a || 0)));
    const expanded = this.expandedRuns || new Set();
    const fmtRunName = (k) => {
      const r = runs.find(x => String(x.id) === String(k));
      if (r) return r.name || '';
      const t = groupBy[k][0] && groupBy[k][0].time;
      return '检测（' + new Date(t || +k).toLocaleString('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false }) + '）';
    };
    keys.forEach((k, ki) => {
      const items = groupBy[k];
      const isOpen = expanded.has(k) || (ki === 0);
      const head = el('div', { style: 'display:flex;gap:8px;align-items:center;margin:' + (ki ? '18px 0 6px' : '0 0 6px') + ';padding:8px 10px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;cursor:pointer;flex-wrap:wrap',
        onclick: () => { expanded.has(k) ? expanded.delete(k) : expanded.add(k); this.renderIssues(); } },
        el('span', { style: 'font-weight:700;font-size:13px', text: (ki === 0 ? '🆕 本次' : '🕐 上次/历史') + ' · ' + fmtRunName(k) }),
        el('span', { class: 'count', text: items.length + ' 条' }),
        el('span', { style: 'color:var(--ink2);font-size:12px', text: isOpen ? '（点标题折叠）' : '（点击展开）' }),
        el('div', { class: 'spacer', style: 'flex:1' }),
        el('button', { class: 'btn small danger', text: '🗑 清空本批', onclick: async (e) => {
          e.stopPropagation();
          if (!(await confirmDlg('删除该批次的 ' + items.length + ' 条结果？（仅清结果，不影响正文）'))) return;
          const ids = new Set(items.map(i => i.id));
          this.issues = this.issues.filter(i => !ids.has(i.id));
          this.saveIssues();
          localStorage.setItem('workbench_runs', JSON.stringify(runs.filter(r => String(r.id) !== String(k))));
          this.renderIssues();
        } })
      );
      box.appendChild(head);
      if (!isOpen) return;
      for (const it of items) {
        const cls = it.confidence === 'high' ? 'high' : it.confidence === 'low' ? 'low' : 'med';
        box.appendChild(el('div', { class: 'issue ' + cls },
          el('div', { style: 'display:flex;gap:8px;align-items:center;flex-wrap:wrap' },
            el('b', { text: ({ high: '⚠️ [高置信]', med: '⚠️ [中置信]', low: 'ℹ️ [低置信]' })[it.confidence] || '⚠️' }),
            el('span', { class: 'count', text: it.chapter || '未知章节' })
          ),
          el('div', { style: 'margin-top:6px;font-size:14px;line-height:1.7', text: it.analysis }),
          it.rule ? el('div', { class: 'rule', style: 'margin-top:4px;font-size:12.5px;color:#a8542a', text: '📖 违反设定：' + it.rule }) : null,
          it.quote ? el('div', { class: 'q', text: '原文：' + it.quote }) : null,
          it.suggestion ? el('div', { class: 'muted', text: '建议：' + it.suggestion }) : null,
          el('div', { class: 'acts' },
            el('button', { class: 'btn small primary', text: '📍 定位到章节', onclick: async () => {
              if (it.chapter) {
                const chapters = await dbAll('chapters');
                const ch = chapters.find(x => x.title === it.chapter);
                if (ch) {
                  await Writing.open(ch.id);
                  App.navTo('writing');
                  toast('已打开章节「' + ch.title + '」，找到问题位置后自行修改（AI 不会替你改）', 'ok');
                  return;
                }
              }
              App.navTo('writing');
            } }),
            el('button', { class: 'btn small', text: '✅ 我已处理', onclick: async () => {
              it.status = 'fixed';
              this.saveIssues();
              await logAdd('检测', '问题已处理：' + it.analysis.slice(0, 30));
              this.renderIssues();
            } }),
            el('button', { class: 'btn small', text: '🙈 忽略（误报）', onclick: async () => {
              it.status = 'ignored';
              this.saveIssues();
              this.renderIssues();
            } })
          )
        ));
      }
    });
  },

  async renderLog() {
    const box = $('#d-log', this.c);
    const logs = await dbAll('log');
    logs.sort((a, b) => b.time - a.time);
    box.innerHTML = '';
    if (!logs.length) { box.innerHTML = '<div class="muted">暂无操作记录。AI 的每一次行为（生成/采纳/识别/检测/改名…）都会记录在这里。</div>'; return; }
    const TAG = { 'AI对话': '🤖', '采纳': '✅', '章节': '📖', '人物': '👥', '世界观': '🌍', '势力': '🏯', '大纲': '📋', '检测': '🔍', '设置': '⚙️', '数据': '📦', '撤销': '↩' };
    for (const l of logs.slice(0, 100)) {
      box.appendChild(el('div', { class: 'log-item' },
        el('span', { class: 't', text: new Date(l.time).toLocaleString('zh-CN', { hour12: false }) }),
        el('span', { class: 'tag', text: (TAG[l.type] || '·') + ' ' + l.type }),
        el('span', { class: 'd', text: l.desc })
      ));
    }
    if (logs.length > 100) box.appendChild(el('div', { class: 'muted', style: 'padding:8px', text: '（仅显示最近 100 条）' }));
  }
};

PageMods.detect = Detect;

;
;App.boot();
</script>
</body>
</html>
