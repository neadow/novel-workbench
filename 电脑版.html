<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>诸葛说说（电脑版）</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#c98b4b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="icons/icon-192.png">
<style>
/* ========== 诸葛说说 · 全局样式 ========== */
:root {
  --bg: #f7f3ea; --bg2: #fffdf7; --panel: #fffaf0; --ink: #3a2e28; --ink2: #8a7a6a;
  --line: #e5d9c3; --accent: #c98b4b; --accent-soft: #f3e3c8; --danger: #c95b5b; --ok: #5aa469;
  --shadow: 0 8px 28px rgba(90, 70, 40, .14);
  --radius: 14px;
  --font: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
}
[data-theme="dark"] {
  --bg: #191420; --bg2: #211a2a; --panel: #271f31; --ink: #efe6d8; --ink2: #a49484;
  --line: #3c3146; --accent: #d99a5b; --accent-soft: #3a2c3f; --danger: #e07a7a; --ok: #7cbf8b;
  --shadow: 0 8px 28px rgba(0, 0, 0, .45);
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { font-family: var(--font); background: var(--bg); color: var(--ink); font-size: 15px; }
button { font-family: inherit; cursor: pointer; }
::selection { background: var(--accent-soft); }

/* ===== 基础控件 ===== */
.input, textarea.input, select.input {
  font-family: inherit; font-size: 15px; padding: 9px 12px; border: 1px solid var(--line);
  border-radius: 10px; background: var(--bg2); color: var(--ink); outline: none;
}
.input:focus { border-color: var(--accent); }
.btn {
  padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg2);
  color: var(--ink); font-size: 14px; transition: filter .15s, transform .05s;
}
.btn:active { transform: scale(.97); }
.btn:hover { filter: brightness(1.04); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.btn.danger { color: var(--danger); }
.btn.small { padding: 4px 9px; font-size: 12.5px; border-radius: 8px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.count { font-size: 12px; color: var(--ink2); white-space: nowrap; }

/* ===== 应用骨架 ===== */
#app { display: flex; flex-direction: column; height: 100dvh; }
header.top {
  display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: var(--bg2);
  border-bottom: 1px solid var(--line); z-index: 40;
}
header.top .brand { font-weight: 800; font-size: 17px; letter-spacing: 1px; color: var(--accent); }
header.top .brand small { font-weight: 400; font-size: 11px; color: var(--ink2); margin-left: 6px; }
nav.tabs { display: flex; gap: 2px; margin-left: auto; overflow-x: auto; }
nav.tabs button {
  border: none; background: none; padding: 8px 12px; border-radius: 9px; color: var(--ink2);
  font-size: 14px; white-space: nowrap;
}
nav.tabs button.on { background: var(--panel); color: var(--accent); font-weight: 700; }
main { flex: 1; overflow: hidden; position: relative; }
.page { display: none; position: absolute; inset: 0; }
.page.active { display: flex; }
nav.bottom { display: none; }

/* ===== 页面通用 ===== */
.page-inner { flex: 1; overflow: auto; padding: 18px; }
.page-title { font-size: 18px; font-weight: 700; margin-bottom: 14px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.page-title .spacer { flex: 1; }
.card {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px; margin-bottom: 12px;
}
.card h4 { font-size: 14px; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.muted { color: var(--ink2); font-size: 12.5px; }
.empty-tip { color: var(--ink2); text-align: center; padding: 40px 20px; font-size: 13.5px; line-height: 2; }

/* ===== 写作页 ===== */
.page-writing { flex-direction: row; overflow: hidden; }
.w-list {
  width: 235px; min-width: 235px; border-right: 1px solid var(--line); background: var(--bg2);
  display: flex; flex-direction: column; overflow: hidden;
}
.w-list-h { display: flex; gap: 8px; padding: 10px; border-bottom: 1px solid var(--line); align-items: center; }
.w-list-h .spacer { flex: 1; }
#chapter-list { flex: 1; overflow: auto; padding: 8px; }
.chap-item {
  padding: 9px 10px; border-radius: 10px; cursor: pointer; margin-bottom: 4px; border: 1px solid transparent;
  display: flex; align-items: center; gap: 6px;
}
.chap-item:hover { background: var(--panel); }
.chap-item.on { background: var(--panel); border-color: var(--accent); }
.chap-item .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13.5px; }
.chap-item .c { font-size: 11px; color: var(--ink2); }
.w-editor { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.w-editor-h { display: flex; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); align-items: center; flex-wrap: wrap; }
.w-editor-h #chap-title { flex: 1; min-width: 120px; font-weight: 600; }
.w-outline { padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--bg2); max-height: 150px; overflow: auto; }
.w-outline-h { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink2); margin-bottom: 6px; flex-wrap: wrap; }
.w-outline-h .spacer { flex: 1; }
.w-outline.collapsed { max-height: 38px; overflow: hidden; }
.w-outline.collapsed #ol-body { display: none; }
.outline-item { display: flex; align-items: center; gap: 8px; padding: 4px 2px; font-size: 13.5px; }
.outline-item input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); }
.outline-item .txt { flex: 1; }
.outline-item .txt.done { text-decoration: line-through; color: var(--ink2); }
.w-selected {
  display: flex; align-items: center; gap: 6px; padding: 6px 12px; background: var(--accent-soft);
  border-bottom: 1px solid var(--line); font-size: 12.5px; flex-wrap: wrap;
}
.w-selected[hidden] { display: none; }
#chap-content {
  flex: 1; width: 100%; border: none; outline: none; resize: none; padding: 18px;
  font-size: 16.5px; line-height: 1.9; background: var(--bg); color: var(--ink); font-family: var(--font);
}
#chap-content:read-only { opacity: .72; }
.w-ai {
  width: 350px; min-width: 350px; border-left: 1px solid var(--line); background: var(--bg2);
  display: flex; flex-direction: column; overflow: hidden;
}
.w-ai-h { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); font-weight: 700; }
.w-ai-h .ctx { font-weight: 400; font-size: 11px; color: var(--ok); }
.w-ai-h .spacer { flex: 1; }
.chat-box { flex: 1; overflow: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 92%; padding: 10px 12px; border-radius: 12px; font-size: 14px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
.msg.user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
.msg.ai { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.msg .acts { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.msg .meta { font-size: 11px; color: var(--ink2); margin-top: 6px; }
.chat-in { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--line); align-items: flex-end; }
.chat-in textarea { flex: 1; max-height: 140px; }
.chat-quick { display: flex; gap: 6px; padding: 8px 10px 0; flex-wrap: wrap; }

/* ===== 人物页 ===== */
.char-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
.char-card { cursor: pointer; }
.char-card .name { font-size: 16px; font-weight: 700; }
.char-card .bio { font-size: 12.5px; color: var(--ink2); margin-top: 6px; line-height: 1.6; max-height: 60px; overflow: hidden; }
.pending-fact { display: flex; gap: 8px; align-items: flex-start; padding: 8px; border: 1px dashed var(--accent); border-radius: 10px; margin-top: 6px; font-size: 13px; }
.pending-fact .src { font-size: 11px; color: var(--ink2); }
.relation-chip { display: inline-flex; align-items: center; gap: 4px; background: var(--bg); border: 1px solid var(--line); border-radius: 20px; padding: 3px 10px; font-size: 12px; margin: 2px; }
.rel-graph { width: 100%; height: 520px; background: var(--bg2); border: 1px solid var(--line); border-radius: var(--radius); touch-action: none; }

/* ===== 世界观 ===== */
.cat-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.cat-tabs button { border: 1px solid var(--line); background: var(--bg2); border-radius: 20px; padding: 6px 14px; font-size: 13px; color: var(--ink2); }
.cat-tabs button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.world-item .title { font-size: 15px; font-weight: 700; }
.world-item .content { font-size: 13.5px; color: var(--ink); line-height: 1.8; white-space: pre-wrap; margin-top: 6px; }

/* ===== 宗门布局 ===== */
.sect-wrap { overflow: auto; background: var(--bg2); border: 1px solid var(--line); border-radius: var(--radius); }
.sect-wrap svg { display: block; }

/* ===== 世界观页（设定库 + AI 对话） ===== */
.world-page { display: flex; flex-direction: row; }
.world-main { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.world-main .page-inner { flex: 1; overflow: auto; }
/* ===== 地图页 ===== */
.map-page { display: flex; flex-direction: row; }
.map-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.map-toolbar { display: flex; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--bg2); align-items: center; flex-wrap: wrap; }
.map-toolbar .spacer { flex: 1; }
/* ===== 地图页：手绘地图册风格（海洋大陆 / 实线国界 / 竖排国名 / 黑白山河 / 图例罗盘） ===== */
.map-board {
  position: relative; flex: 1; overflow: hidden;
  background-color: #c9dde3; /* 海洋浅蓝 */
}
.map-board::before {
  content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 0;
  background-image:
    radial-gradient(rgba(255,255,255,.35) 1px, transparent 1px),
    linear-gradient(135deg, rgba(120,160,175,.05) 25%, transparent 25%, transparent 75%, rgba(120,160,175,.05) 75%);
  background-size: 26px 26px, 60px 60px; /* 海面波纹微光 */
}
.map-board::after {
  content: ''; position: absolute; inset: 7px; pointer-events: none; z-index: 26;
  border: 1.5px solid rgba(80,62,36,.55); border-radius: 8px;
  box-shadow: inset 0 0 0 3px rgba(80,62,36,.08);
}
.map-board .dir {
  position: absolute; transform: translate(-50%, -50%); z-index: 22;
  font-size: 13px; font-weight: 700; color: #5b7180; opacity: .8;
  font-family: 'STKaiti','KaiTi','楷体',serif; letter-spacing: 2px;
  pointer-events: none; user-select: none; text-shadow: 0 1px 0 rgba(255,255,255,.5);
}
.map-board .dir.mid { display: none; }
.map-empty {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  text-align: center; white-space: pre-line; line-height: 2.1; color: #5a4630; font-size: 15px; pointer-events: none; z-index: 8;
}
/* 大陆（米黄土地 + 海岸线） */
.map-baseimg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
.map-continent { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; overflow: visible; }
.map-continent path.continent { fill: #f4e9c9; stroke: #a0804f; stroke-width: 2.6; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
.map-continent path.continent-shore { fill: none; stroke: rgba(160,128,79,.35); stroke-width: 6; vector-effect: non-scaling-stroke; }
/* 山河线（黑白手绘） */
.map-lines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; overflow: visible; }
.map-lines path.ln { vector-effect: non-scaling-stroke; fill: none; stroke-linecap: round; pointer-events: stroke; }
.map-lines path.ln-mtn { stroke: #4a4034; stroke-width: 2; opacity: .9; }
.map-lines path.ln-riv { stroke: #3a4a55; stroke-width: 2.2; opacity: .85; }
.map-lines .ln-handle { fill: #fff; stroke: #4a4034; stroke-width: 1.4; vector-effect: non-scaling-stroke; pointer-events: all; cursor: move; }
.ln-label {
  position: absolute; transform: translate(-50%, -50%); z-index: 7; cursor: pointer;
  background: rgba(250,244,226,.75); border-radius: 4px; padding: 0 5px;
  font-size: 11.5px; font-weight: 700; color: #4a4034; white-space: nowrap; pointer-events: auto;
  font-family: 'STKaiti','KaiTi','楷体',serif; letter-spacing: 1px;
}
/* 地图缩放视图容器 */
.map-view { position: absolute; inset: 0; transform-origin: center; }
/* 领土范围：虚线国界（画在大陆上） */
.map-territories { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; overflow: visible; }
.terr { fill: rgba(255,252,240,.16); stroke: #6b4f2a; stroke-width: 1.9; stroke-dasharray: 8 5; vector-effect: non-scaling-stroke; pointer-events: all; stroke-linejoin: round; }
.terr-国家 { stroke: #6b4f2a; fill: rgba(255,252,240,.2); }
.terr-州郡 { stroke: #8a6a3c; stroke-width: 1.4; stroke-dasharray: 5 4; fill: rgba(255,252,240,.1); }
.terr-蛮荒 { stroke: #6f8a5c; fill: rgba(226,236,214,.32); }
.terr:hover { stroke-width: 2.5; }
/* 底图模式下的虚线国界 */
.terr-dash { fill: none; stroke: #6b4f2a; stroke-width: 1.7; stroke-dasharray: 7 4; vector-effect: non-scaling-stroke; pointer-events: all; stroke-linejoin: round; background: transparent; }
/* 国名：竖排大字（楷体） */
.terr-name {
  position: absolute; transform: translate(-50%, -50%); z-index: 6; cursor: grab;
  writing-mode: vertical-rl; text-orientation: upright;
  font-family: 'STKaiti','KaiTi','楷体','SimSun',serif;
  font-size: calc(17px + 0.9vw); font-weight: 700; letter-spacing: 7px; line-height: 1.15;
  color: #4a3015; text-shadow: 0 1px 2px rgba(255,250,235,.9), 0 0 6px rgba(244,233,201,.7);
  max-height: 80%; user-select: none; pointer-events: auto; touch-action: none; white-space: nowrap;
}
.terr-name:active { color: #a8542a; }
/* 从属城名：小字直排（非胶囊） */
.mpin {
  position: absolute; transform: translate(-50%, -50%); z-index: 5; cursor: grab; touch-action: none;
  display: flex; align-items: center; gap: 2px;
  color: #5a3d1f; padding: 1px 4px; border-radius: 4px; user-select: none;
  font-family: 'STKaiti','KaiTi','楷体',serif;
}
.mpin .mpin-i { font-size: 11px; }
.mpin .mpin-n { font-size: 13px; font-weight: 700; white-space: nowrap; letter-spacing: 1px; }
.mpin:hover { background: rgba(255,250,235,.55); }
/* 地图标题（卷轴横幅） */
.map-title {
  position: absolute; left: 50%; top: 10px; transform: translateX(-50%); z-index: 24;
  background: rgba(244,233,201,.92); border: 1.6px solid #7a5c33; border-radius: 14px;
  padding: 3px 26px; font-size: 16px; font-weight: 800; color: #4a3015; letter-spacing: 6px;
  font-family: 'STKaiti','KaiTi','楷体',serif; pointer-events: none; white-space: nowrap;
  box-shadow: 0 2px 6px rgba(90,60,20,.18);
}
.map-title::before, .map-title::after {
  content: ''; position: absolute; top: 50%; width: 14px; height: 6px; margin-top: -3px;
  background: rgba(122,92,51,.55); border-radius: 3px;
}
.map-title::before { left: -7px; } .map-title::after { right: -7px; }
/* 图例 */
.map-legend {
  position: absolute; right: 12px; bottom: 12px; z-index: 24; pointer-events: none;
  background: rgba(250,244,226,.9); border: 1.2px solid #9a7b4f; border-radius: 8px;
  padding: 6px 10px; font-size: 11.5px; color: #4a3015; line-height: 1.9;
  font-family: 'STKaiti','KaiTi','楷体',serif;
}
.map-legend b { font-size: 12px; display: block; }
.map-legend .lg { display: flex; align-items: center; gap: 6px; }
.map-legend svg { width: 34px; height: 12px; flex: none; }
/* 罗盘 */
.map-compass { position: absolute; right: 12px; top: 12px; z-index: 24; pointer-events: none; opacity: .9; }
.only-pc { display: none; }
@media (min-width: 1201px) { .only-pc { display: inline; } }
/* 世界观 AI 对话面板（早期地图页沿用下来的类名已改名） */
.world-ai {
  width: 330px; min-width: 330px; border-left: 1px solid var(--line); background: var(--bg2);
  display: flex; flex-direction: column; overflow: hidden;
}
.world-ai-h { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); font-weight: 700; }
.world-ai-h .ctx { font-weight: 400; font-size: 11px; color: var(--ok); }
.world-ai-h .spacer { flex: 1; }
@media (max-width: 1200px) {
  .world-ai {
    position: fixed; right: 0; top: 0; bottom: 0; width: min(92vw, 400px); z-index: 80;
    transform: translateX(105%); transition: transform .25s; box-shadow: var(--shadow);
  }
  .world-ai.open { transform: none; }
}

/* ===== 检测页 ===== */
.issue {
  border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 10px;
  padding: 12px; margin-bottom: 10px; background: var(--panel);
}
.issue.high { border-left-color: var(--danger); }
.issue.med { border-left-color: var(--accent); }
.issue.low { border-left-color: var(--ok); }
.issue .q { font-size: 12px; font-style: italic; color: var(--ink2); background: var(--bg); padding: 6px 8px; border-radius: 8px; margin: 6px 0; }
.issue .acts { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }

/* ===== 设置页 ===== */
.settings-form { max-width: 640px; }
.settings-form .row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.settings-form label { font-size: 13px; font-weight: 600; color: var(--ink2); }
.settings-form .hint { font-size: 12px; color: var(--ink2); line-height: 1.7; }

/* ===== 日志 ===== */
.log-item { display: flex; gap: 10px; align-items: baseline; font-size: 13px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.log-item .t { color: var(--ink2); font-size: 12px; white-space: nowrap; }
.log-item .d { flex: 1; }
.log-item .tag { font-size: 11px; padding: 1px 8px; border-radius: 10px; background: var(--accent-soft); white-space: nowrap; }

/* ===== 弹窗 / 提示 ===== */
.modal-mask {
  position: fixed; inset: 0; background: rgba(20, 15, 25, .5); z-index: 200;
  display: flex; align-items: center; justify-content: center; padding: 20px;
}
.modal { background: var(--bg2); border-radius: 16px; max-width: 480px; width: 100%; box-shadow: var(--shadow); overflow: hidden; }
.modal-h { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; font-weight: 700; border-bottom: 1px solid var(--line); }
.modal-h .x { border: none; background: none; color: var(--ink2); font-size: 15px; }
.modal-b { padding: 16px; max-height: 60vh; overflow: auto; }
.modal-f { display: flex; justify-content: flex-end; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--line); }
#toast-box { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 300; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast { background: var(--panel); border: 1px solid var(--line); color: var(--ink); padding: 9px 18px; border-radius: 20px; font-size: 13.5px; box-shadow: var(--shadow); opacity: 1; transition: opacity .4s; }
.toast.ok { border-color: var(--ok); }
.toast.err { border-color: var(--danger); color: var(--danger); }
.toast.out { opacity: 0; }

/* ===== 响应式：平板 / 手机 ===== */
@media (max-width: 1200px) {
  .w-ai {
    position: fixed; right: 0; top: 0; bottom: 0; width: min(92vw, 400px); z-index: 80;
    transform: translateX(105%); transition: transform .25s; box-shadow: var(--shadow);
  }
  .w-ai.open { transform: none; }
}
@media (max-width: 768px) {
  nav.tabs { display: none; }
  nav.bottom {
    display: flex; position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg2);
    border-top: 1px solid var(--line); z-index: 70;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  nav.bottom button {
    flex: 1; padding: 9px 2px 11px; font-size: 11px; background: none; border: none;
    color: var(--ink2); display: flex; flex-direction: column; gap: 2px; align-items: center;
  }
  nav.bottom button.on { color: var(--accent); font-weight: 700; }
  /* 底部空间给到 .page 自身（absolute 定位不受 main padding 影响） */
  main { padding-bottom: 0; }
  .page { padding-bottom: calc(64px + env(safe-area-inset-bottom, 0px)); }
  .w-list {
    position: fixed; left: 0; top: 0; bottom: 0; width: min(82vw, 300px); z-index: 80;

async function worldFactionLines() {
  const list = await factionItems();
  if (!list.length) return '（暂无势力结构）';
  const byParent = {};
  for (const it of list) {
    const p = it.parent || '';
    (byParent[p] = byParent[p] || []).push(it);
  }
  const lines = [];
  const seen = new Set();
  const walk = (parent, depth) => {
    for (const it of (byParent[parent] || [])) {
      if (seen.has(it.title)) continue; // 防循环

      lines.push('  '.repeat(depth) + '- ' + it.title + (it.core ? '（🔒）' : ''));

/* 旧数据一次性迁移：sect 势力树 → world 势力条目；人物 faction.nodeId → itemId/name */
async function migrateLegacySect() {
  try {
    const tree = await dbGet('sect', 'tree');

    if (!nodes.length) return 0;
    const rec = await getWorldRec();
    let added = 0;
    const parentName = (id) => { const n = nodes.find(x => x.id === id); return n ? n.name : null; };

    const depth = {};
    const depthOf = (id) => { if (depth[id] !== undefined) return depth[id]; const n = nodes.find(x => x.id === id); depth[id] = n && n.parentId ? depthOf(n.parentId) + 1 : 0; return depth[id]; };

    const ordered = [...nodes].sort((a, b) => depth[a.id] - depth[b.id]);
    for (const n of ordered) {
      if (!n.name) continue;
      const title = n.name;
      const exists = rec.items.find(x => x.category === '势力' && x.title === title);
      if (!exists) {
        const pName = parentName(n.parentId);
        rec.items.push({
          id: uid(), category: '势力', title,
          content: [n.role ? '性质：' + n.role : '', n.note || ''].filter(Boolean).join('\n') || '（由旧势力树迁移）',

    const chars = await dbAll('characters');

}

          await this.flushSave();
          const n = await CharOps.extractFromChapter(this.curId);
          toast('识别到 ' + n + ' 条特征，去「人物」页确认采纳', 'ok');
        } catch (e) { toast('提取失败：' + e.message, 'err'); }
      } else toast('人物模块尚未就绪', 'err');
    };

    // 发送聊天
    const send = async () => {
      const inp = $('#chat-input', c);
      const text = inp.value.trim();
      if (!text || this.busy) return;
      inp.value = '';
      await this.chatAsk(text, { kind: 'chat' });
    };
    $('#chat-send', c).onclick = send;
    $('#chat-input', c).addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });

    // 工具栏
    $('#btn-lock', c).onclick = async () => {
      const ch = await this.getCur();
      if (!ch) return;
      const newLocked = !ch.locked;
      if (ch.locked && !(await confirmDlg('解锁本章？解锁后 AI 才可以修改本章内容。'))) return;
      ch.locked = newLocked; // 同步内存对象，保证 UI 立即刷新
      await this.saveCur({ locked: newLocked });
      await logAdd('章节', (newLocked ? '锁定' : '解锁') + '章节「' + ch.title + '」');
      this.renderEditor(ch);
      this.refreshList();
      toast(newLocked ? '已锁定（AI 无法修改本章）' : '已解锁', 'ok');
    };
    $('#btn-analyze', c).onclick = () => this.analyzeChapter();
    $('#btn-analyze-all', c).onclick = () => this.analyzeAllChapters();
    $('#btn-mem', c).onclick = () => this.buildBookMemory();
    $('#btn-undo', c).onclick = async () => {
      const ch = await this.getCur();
      if (!ch || !ch.snapshots.length) { toast('没有可撤销的 AI 改动', 'err'); return; }
      if (!(await confirmDlg('撤销最近一次 AI 改动？'))) return;
      const snap = ch.snapshots.pop();
      ch.content = snap.content;
      await this.saveCur({ content: ch.content, snapshots: ch.snapshots });
      await logAdd('撤销', '撤销 AI 改动（章节「' + ch.title + '」）');
      this.renderEditor(ch);
      toast('已撤销', 'ok');
    };
    $('#btn-copy', c).onclick = async () => {
      const ch = await this.getCur();
      if (ch) copyText(ch.content);
    };
    $('#btn-export-chap', c).onclick = async () => {
      const ch = await this.getCur();
      if (ch) download((ch.title || '章节') + '.txt', ch.content);
    };
    $('#btn-del-chap', c).onclick = async () => {
      const ch = await this.getCur();
      if (!ch) return;
      if (!(await confirmDlg('删除章节「' + ch.title + '」？此操作不可恢复！'))) return;
      await dbDel('chapters', ch.id);
      await logAdd('章节', '删除章节「' + ch.title + '」');
      this.curId = null;
      const chapters = await dbAll('chapters');
      if (chapters.length) await this.open(chapters[0].id);
      else { this.curId = null; $('#chap-title', c).value = ''; $('#chap-content', c).value = ''; this.updateCount(); }
      this.refreshList();
    };
  },

  /* ---------- 数据 ---------- */
  async getCur() { return this.curId ? await dbGet('chapters', this.curId) : null; },
  async saveCur(patch) {
    const ch = await this.getCur();
    if (!ch) return;
    Object.assign(ch, patch);
    ch.updatedAt = Date.now();
    await dbPut('chapters', ch);
  },
  updateCount() {
    const ta = $('#chap-content', this.c);
    $('#chap-count', this.c).textContent = ta ? wordCount(ta.value) + ' 字' : '';
  },

  async refreshList() {
    const chapters = await dbAll('chapters');
    chapters.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
    const box = $('#chapter-list', this.c);
    box.innerHTML = '';
    for (const ch of chapters) {
      box.appendChild(el('div', {
        class: 'chap-item' + (ch.id === this.curId ? ' on' : ''),
        onclick: () => this.open(ch.id)
      },
        el('span', { text: ch.locked ? '🔒' : '' }),
        el('span', { class: 't', text: ch.title }),
        el('span', { class: 'c', text: wordCount(ch.content) })
      ));
    }
  },

  async open(id) {
    // 保存旧章节（输入框中的最新值）
    if (this.curId) {
      const old = await dbGet('chapters', this.curId);
      if (old) {
        const ta = $('#chap-content', this.c);
        if (ta && ta.value !== old.content) await this.saveCur({ content: ta.value });
      }
    }
    this.curId = id;
    const ch = await dbGet('chapters', id);
    if (!ch) return;
    this.renderEditor(ch);
    this.refreshList();
  },

  renderEditor(ch) {
    $('#chap-title', this.c).value = ch.title || '';
    $('#chap-content', this.c).value = ch.content || '';
    $('#chap-content', this.c).readOnly = !!ch.locked;
    $('#btn-lock', this.c).textContent = ch.locked ? '🔓 解锁' : '🔒 锁定';

  async renderOutline() {
    const box = $('#ol-body', this.c);

    const doneN = items.filter(i => i.done).length;
    count.textContent = doneN + '/' + items.length + ' 完成';
    items.forEach((it, i) => {

        el('span', { class: 'txt' + (it.done ? ' done' : ''), text: (i + 1) + '. ' + it.text, style: 'cursor:pointer', title: '点击编辑', onclick: async () => {

  /* 整书剧情弧：新增/编辑 */
  async addBookArc() {
    const title = await promptDlg('剧情弧标题', '', '如：第一卷 · 青云山下（建议含大致章节范围）');

  async editBookArc(arc) {

  /* 🔍 全文审校（融合 Novel-OS 编辑流水线 + novel-writing-framework 去 AI 味） */
  async reviewChapter() {
    await this.flushSave(); // 先保存最新正文再审校（防止读到防抖中的旧内容）
    const ch = await this.getCur();
    if (!ch) return;
    if (!(ch.content || '').trim()) { toast('本章还没有正文', 'err'); return; }
    this.setBusy(true);
    toast('🔍 AI 正在全文审校（逻辑/人设/文风/节奏/AI腔）…', 'info');
    try {
      const ctx = await AI.projectContext({ chapterId: ch.id });
      const sysReview = '你是资深网文审校编辑。对章节做多维度审查：1)逻辑漏洞（前后矛盾、因果断裂）2)人设崩塌（言行不符性格/说话风格）3)文风一致性 4)节奏问题（拖沓/过急）5)AI腔（排比堆砌、每段总结、滥用"然而/不禁/仿佛/顿时"）。' +
        '规则：只报告、给建议；quote 必须逐字摘自原文（20~40字、选正文中唯一的一段，便于程序定位）；若该处值得直接修改，给出 replacement（用于替换 quote 的完整新文本，替换后上下文通顺）；若只是提醒无需替换则不写 replacement。\n' + ctx.text;
      // 分窗审校：≤12000 字整章一次；更长的章节按段落边界切窗逐段审，避免只审前 12000 字（后文问题漏检）
      const windows = this.splitReviewWindows(ch.content);
      if (windows.length > 1) taskProgress('🔍 本章较长，分 ' + windows.length + ' 段审校…');
      const issues = [];
      for (let wi = 0; wi < windows.length; wi++) {
        if (windows.length > 1) taskProgress('🔍 审校第 ' + (wi + 1) + '/' + windows.length + ' 段…', Math.round((wi + 1) / windows.length * 100));
        const data = await AI.json([
          { role: 'system', content: sysReview },
          { role: 'user', content: '章节《' + ch.title + '》' + (windows.length > 1 ? '（第 ' + (wi + 1) + '/' + windows.length + ' 段）' : '') + '：\n"""\n' + windows[wi] + '\n"""\n输出：{"issues":[{"dimension":"逻辑|人设|文风|节奏|AI腔","quote":"逐字原文摘录","analysis":"问题分析","suggestion":"修改建议","replacement":"建议替换后的文本(可选)"}]}，没有就输出 {"issues":[]}。' }
        ]);
        for (const it of (data.issues || [])) {
          if (it && it.analysis) { it.window = wi; issues.push(it); }
        }
      }
      taskProgressDone();
      if (!issues.length) {
        await logAdd('审校', '《' + ch.title + '》审校通过，无问题');
        toast('审校通过：未发现明显问题', 'ok');
        return;
      }
      this.setBusy(false); // AI 识别已完成，面板展示阶段解除 busy，面板内操作（发送到 AI 助手等）可用
      // 报告面板：可勾选多条，支持「综合修改」或「发送到 AI 助手」；也可单条「用这条替换」
      const body = el('div', {});
      const openIssues = () => issues.filter(it => !it.ignored);
      const collectChecked = () => openIssues().filter(it => it._pick);
      const canApplyTotal = () => openIssues().filter(i => i.replacement && i.replacement.trim()).length;
      const renderIssues = () => {
        body.innerHTML = '';
        // 操作区（多选采纳 → 综合修改 / 发送到 AI 助手）
        body.appendChild(el('div', { style: 'display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap' },
          el('span', { id: 'review-progress', class: 'muted', style: 'flex:1;min-width:140px' }),
          el('button', { id: 'rv-combine', class: 'btn small primary', text: '🤖 综合修改已采纳', onclick: async () => {
            const picked = collectChecked();
            if (!picked.length) { toast('请先勾选要采纳的建议', 'err'); return; }
            await this.combineAccepted(picked);
          } }),
          el('button', { id: 'rv-send', class: 'btn small', text: '📤 发送到 AI 助手', onclick: async () => {
            const picked = collectChecked();
            if (!picked.length) { toast('请先勾选要采纳的建议', 'err'); return; }
            await this.sendAcceptedToAI(picked);
          } })
        ));
        issues.forEach((it, idx) => {
          if (it.ignored) return; // 忽略的条目不再渲染（旧版只删 DOM，重渲染后又会冒出来）
          body.appendChild(el('div', { class: 'issue ' + (it.dimension === 'AI腔' ? 'low' : 'med') },
            el('div', { style: 'display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap' },
              el('div', { style: 'display:flex;gap:8px;align-items:center' },
                el('input', { type: 'checkbox', class: 'rv-chk', 'data-i': idx, checked: it._pick ? 'checked' : null, style: 'width:18px;height:18px;accent-color:var(--accent)', onchange: (e) => { it._pick = e.target.checked; updateBar(); } }),
                el('b', { text: '[' + (it.dimension || '问题') + ']' + (it.applied ? ' ✅已替换' : '') })
              ),
              el('div', { style: 'display:flex;gap:6px' },
                it.replacement && it.replacement.trim() && !it.applied ? el('button', { class: 'btn small primary', text: '✅ 用这条替换', onclick: async (e) => {
                  const ok2 = await this.applyReplacement(it);
                  if (ok2) { it.applied = true; renderIssues(); }
                } }) : null,
                el('button', { class: 'btn small danger', text: '✗ 忽略', onclick: () => { it.ignored = true; it._pick = false; renderIssues(); } })
              )
            ),
            it.quote ? el('div', { class: 'q', text: '原文：' + it.quote }) : null,
            it.replacement && it.replacement.trim() ? el('div', { class: 'q', style: 'border-left-color:#5aa469', text: '替换为：' + it.replacement }) : null,
            el('div', { style: 'margin-top:6px;font-size:14px;line-height:1.7', text: it.analysis }),
            it.suggestion ? el('div', { class: 'muted', style: 'margin-top:6px', text: '建议：' + it.suggestion }) : null
          ));
        });
        updateBar();
      };
      const updateBar = () => {
        const n = collectChecked().length;
        const bar = body.querySelector('#review-progress');
        if (bar) bar.textContent = n > 0 ? `☑ 已采纳 ${n} 条 → 可「🤖 综合修改」或「📤 发送到 AI 助手」` : (canApplyTotal() ? '💡 可勾选多条后「综合修改」，或单条点「用这条替换」（自动存档可撤销）' : '以上为建议，可勾选后「发送到 AI 助手」讨论');
        const b1 = body.querySelector('#rv-combine'), b2 = body.querySelector('#rv-send');
        if (b1) b1.disabled = n === 0;
        if (b2) b2.disabled = n === 0;
      };
      renderIssues();
      await modal({ title: '🔍 全文审校 · 《' + ch.title + '》', body, okText: '关闭', cancelable: false });
      await logAdd('审校', '《' + ch.title + '》审校完成，' + issues.length + ' 条建议' + (issues.filter(i => i.applied).length ? '，应用替换 ' + issues.filter(i => i.applied).length + ' 处' : ''));
    } catch (e) {
      toast('审校失败：' + e.message, 'err');
    } finally {
      taskProgressDone();
      this.setBusy(false); // 无论成功/失败/提前 return 都必须解锁，否则按钮永久变灰
    }
  },

  /* 审校分窗：≤size 字整章一次；更长按段落边界切窗，保证全文都被审到（旧版只审前 12000 字） */
  splitReviewWindows(text, size = 12000, maxWindows = 12) {
    const s = String(text || '');
    if (s.length <= size) return [s];
    const out = [];
    let start = 0;
    while (start < s.length && out.length < maxWindows) {
      let end = Math.min(s.length, start + size);
      if (end < s.length) {
        const nl = s.lastIndexOf('\n', end);
        if (nl > start + Math.floor(size * 0.6)) end = nl + 1; // 尽量切在换行处，不切断句子
      }
      out.push(s.slice(start, end));
      start = end;
    }
    if (start < s.length) toast('本章过长，仅审校前 ' + maxWindows + ' 段（约 ' + Math.round(maxWindows * size / 1000) + ' 千字）；建议分章', 'info');
    return out;
  },

  /* 在正文中定位引文：先精确匹配；失败则忽略空白差异归一化后再匹配（AI 常把换行/空格写歪）。
     返回所有命中位置 [[start,end], ...]，供调用方在"多处命中"时让用户选择 */
  locateQuote(content, quote) {
    const s = String(content || '');
    const q = String(quote || '');
    if (!q) return { hits: [] };
    const hits = [];
    let i = s.indexOf(q);
    while (i !== -1) {
      hits.push([i, i + q.length]);
      i = s.indexOf(q, i + Math.max(1, q.length));
      if (hits.length >= 50) break;
    }
    if (hits.length) return { hits };
    // 归一化兜底（忽略空白）：建立「去空白后下标 → 原下标」映射
    const map = [];
    let ns = '';
    for (let k = 0; k < s.length; k++) { if (!/\s/.test(s[k])) { map.push(k); ns += s[k]; } }
    const nq = q.replace(/\s+/g, '');
    if (!nq) return { hits: [] };
    let j = ns.indexOf(nq);
    while (j !== -1) {
      hits.push([map[j], map[j + nq.length - 1] + 1]);
      j = ns.indexOf(nq, j + Math.max(1, nq.length));
      if (hits.length >= 50) break;
    }
    return { hits, normalized: true };
  },

  /* 同一片段在正文出现多处时，让用户选择替换哪一处（旧版总是替换第一处，可能改错地方） */
  pickOccurrence(content, hits, quote) {
    return new Promise((resolve) => {
      const mask = el('div', { class: 'modal-mask' });
      const box = el('div', { class: 'modal' });
      box.appendChild(el('div', { class: 'modal-h', text: '选择要替换的位置' }));
      const b = el('div', { class: 'modal-b' });
      b.appendChild(el('div', { class: 'muted', style: 'margin-bottom:8px;line-height:1.7', text: '这段原文在正文中出现 ' + hits.length + ' 处，请选择要替换的那一处（灰色为前后文，粗体为将被替换的部分）：' }));
      hits.forEach((h, i) => {
        const pre = content.slice(Math.max(0, h[0] - 26), h[0]).replace(/\n/g, ' ');
        const post = content.slice(h[1], h[1] + 26).replace(/\n/g, ' ');
        b.appendChild(el('div', { style: 'border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:6px;background:var(--bg)' },
          el('div', { style: 'font-size:13px;line-height:1.7;white-space:pre-wrap' },
            el('span', { class: 'muted', text: '…' + pre }),
            el('b', { style: 'color:var(--accent)', text: content.slice(h[0], h[1]) }),
            el('span', { class: 'muted', text: post + '…' })
          ),
          el('button', { class: 'btn small primary', style: 'margin-top:6px', text: '选这处（第 ' + (i + 1) + ' 处）', onclick: () => { mask.remove(); resolve(h); } })
        ));
      });
      box.appendChild(b);
      box.appendChild(el('div', { class: 'modal-f' }, el('button', { text: '取消', onclick: () => { mask.remove(); resolve(null); } })));
      mask.appendChild(box);
      document.body.appendChild(mask);
    });
  },

  /* 🤖 综合修改已采纳：AI 汇总勾选建议 → 输出最终替换对 → 预览逐条确认应用 */
  async combineAccepted(picked) {
    this.setBusy(true);
    toast('🤖 AI 正在综合修改建议…', 'info');
    try {
      await this.flushSave();
      const ch = await this.getCur();
      if (!ch) return;
      const ctx = await AI.projectContext({ chapterId: ch.id });
      const advice = picked.map((it, i) => `${i + 1}. [${it.dimension || '问题'}] 原文「${it.quote || ''}」 分析：${it.analysis || ''}${it.suggestion ? ' 建议：' + it.suggestion : ''}${it.replacement ? ' 参考替换：「' + it.replacement + '」' : ''}`).join('\n');
      // 给 AI 看的是【被采纳建议所在处的正文】而不是"章末 2500 字"——否则 AI 看不到自己该引用的片段，quote 无法定位
      const excerpt = this.excerptAroundQuotes(ch.content, picked.map(p => p.quote));
      const data = await AI.json([
        { role: 'system', content: '你是资深网文修改编辑。根据用户采纳的多条审校建议，综合当前章节上下文，给出最终的修改替换对。要求：quote 必须逐字摘自原文（选正文中唯一片段，20~50字）；replacement 为修改后的新文本；同一处多条建议合并成一条；替换后全文通顺、符合人设与文风。只输出 JSON。\n' + ctx.text },
        { role: 'user', content: '章节《' + ch.title + '》相关原文：\n……' + excerpt + '\n\n采纳的建议：\n' + advice + '\n输出：{"replacements":[{"quote":"原文逐字","replacement":"新文本"}]}' }
      ]);
      const reps = (data.replacements || []).filter(r => r && r.quote && r.replacement);
      if (!reps.length) { toast('AI 未给出可应用的修改', 'err'); return; }
      await this.showCombinePreview(reps);
    } catch (e) {
      toast('综合修改失败：' + e.message, 'err');
    } finally {
      this.setBusy(false); // 提前 return 也要解锁，否则按钮永久变灰
    }
  },

  /* 按"被采纳建议的原文位置"截取上下文：每条引文前后各取 radius 字，去重后拼成一段（总长受限）。
     定位不到引文时退回章末（旧行为），保证 AI 至少有上下文 */
  excerptAroundQuotes(content, quotes, { radius = 800, maxChars = 12000 } = {}) {
    const s = String(content || '');
    if (!s) return '';
    const spans = [];
    for (const q of (quotes || [])) {
      const loc = this.locateQuote(s, q);
      if (!loc.hits.length) continue;
      const [a, b] = loc.hits[0];
      spans.push([Math.max(0, a - radius), Math.min(s.length, b + radius)]);
    }
    if (!spans.length) return s.slice(-2500);
    spans.sort((x, y) => x[0] - y[0]);
    const merged = [];
    for (const sp of spans) {
      const last = merged[merged.length - 1];
      if (last && sp[0] <= last[1]) last[1] = Math.max(last[1], sp[1]);
      else merged.push([sp[0], sp[1]]);
    }
    let out = '';
    for (const [a, b] of merged) {
      const piece = (a > 0 ? '……' : '') + s.slice(a, b) + (b < s.length ? '……' : '');
      if (out.length + piece.length > maxChars) { if (!out) out = piece.slice(0, maxChars); break; }
      out += (out ? '\n\n' : '') + piece;
    }
    return out || s.slice(-2500);
  },

  /* 综合修改预览：逐条确认应用（快照可回滚） */
  async showCombinePreview(reps) {
    const body = el('div', {});
    let done = 0;
    const render = () => {
      body.innerHTML = '';
      reps.forEach((r, idx) => {
        if (r.applied) return;
        body.appendChild(el('div', { class: 'issue med' },
          el('div', { class: 'q', text: '原文：' + r.quote }),
          el('div', { class: 'q', style: 'border-left-color:#5aa469', text: '替换为：' + r.replacement }),
          el('div', { style: 'display:flex;gap:6px;margin-top:8px' },
            el('button', { class: 'btn small primary', text: '✅ 应用这条', onclick: async (e) => {
              const ok2 = await this.applyReplacement(r);
              if (ok2) { r.applied = true; done++; render(); }
            } }),
            el('button', { class: 'btn small danger', text: '✗ 跳过', onclick: (e) => { r.applied = true; done++; render(); } })
          )
        ));
      });
      const bar = $('#cmp-progress');
      if (bar) bar.textContent = done >= reps.length ? '✅ 已全部处理' : `剩余 ${reps.length - done} 条（点「应用这条」生效，可↩撤销）`;
    };
    body.appendChild(el('div', { id: 'cmp-progress', class: 'muted', style: 'margin-bottom:6px' }));
    render();
    await modal({ title: '🤖 综合修改预览（逐条确认）', body, okText: '关闭', cancelable: false });
    if (done) await logAdd('审校', '综合修改应用 ' + done + ' 处');
  },

  /* 📤 发送到 AI 助手：把采纳的建议汇总成消息发到对话，继续沟通修改 */
  async sendAcceptedToAI(picked) {
    const text = '（全文审校采纳）以下是我从审校中采纳的建议，请帮我逐条落实修改，可以综合优化，改完给出可直接插入的文本：\n' +
      picked.map((it, i) => `${i + 1}. [${it.dimension || '问题'}] 原文：${it.quote || ''}；分析：${it.analysis || ''}${it.suggestion ? '；建议：' + it.suggestion : ''}${it.replacement ? '；参考替换：' + it.replacement : ''}`).join('\n');
    await this.chatAsk(text, { kind: 'chat', label: '审校修改' });
  },

  /* 应用单条替换（用户看中哪条用哪条）：先落盘 → 定位原文（多处命中让用户选）→ 快照 → 替换 */
  async applyReplacement(it) {
    await this.flushSave(); // 先把编辑器里的最新内容落盘，否则会用 DB 旧正文切片覆盖用户刚输入的文字
    const ch = await this.getCur();
    if (!ch) return false;
    if (ch.locked) { toast('本章已锁定', 'err'); return false; }
    const quote = it.quote || '';
    const rep = (it.replacement || '').trim();
    if (!quote || !rep) return false;
    const loc = this.locateQuote(ch.content, quote);
    if (!loc.hits.length) {
      toast('未能在正文中找到该原文片段（可能已被改动），请手动修改：「' + quote.slice(0, 15) + '…」', 'err');
      return false;
    }
    let hit = loc.hits[0];
    if (loc.hits.length > 1) {
      const picked = await this.pickOccurrence(ch.content, loc.hits, quote);
      if (!picked) { toast('已取消替换', 'info'); return false; }
      hit = picked;
    } else if (loc.normalized) {
      toast('原文片段有空格/换行差异，已按忽略空白的方式定位', 'info');
    }
    ch.snapshots = ch.snapshots || [];
    ch.snapshots.push({ time: Date.now(), content: ch.content });
    if (ch.snapshots.length > 15) ch.snapshots.shift();
    ch.content = ch.content.slice(0, hit[0]) + rep + ch.content.slice(hit[1]);
    ch.updatedAt = Date.now();
    await dbPut('chapters', ch);
    await logAdd('审校', '应用替换（' + it.dimension + '）：「' + quote.slice(0, 12) + '…」');
    this.renderEditor(ch);
    this.refreshList();
    toast('已替换（可点「↩ 撤销」回滚）', 'ok');
    return true;
  },

  /* 立即保存当前编辑内容（发消息/识别/审校前调用，保证 AI 读到最新正文） */
  async flushSave() {
    if (!this.curId) return;
    const c = this.c;
    const ta = $('#chap-content', c);
    const title = $('#chap-title', c);
    if (!ta) return;
    const ch = await this.getCur();
    if (!ch) return;
    const patch = {};
    if (ta.value !== ch.content) patch.content = ta.value;
    if (title && title.value !== ch.title) patch.title = title.value;
    if (Object.keys(patch).length) await this.saveCur(patch);
  },

  /* 前文检索：在“其它章节”正文里找与本次指令/最近对话相关的片段（人物名/关键词命中段），
     让 AI 能看到前文发生了什么（解决“AI 看不到前面章节正文”的问题） */
  async fetchHistoryExcerpt(curText, { maxChars = 4500 } = {}) {
    try {
      const chapters = await dbAll('chapters');
      if (chapters.length <= 1) return [];
      const others = chapters.filter(c => c.id !== this.curId && (c.content || '').length > 0);
      if (!others.length) return [];
      const query = (curText || '') + ' ' + await (async () => {
        try { const chat = await dbGet('chat', this.sid()) || { id: this.sid(), messages: [] }; return chat.messages.slice(-8).filter(m => m.role === 'user').map(m => m.content).join(' '); } catch (e) { return ''; }
      })();
      // 抽取查询词：人物名（人物卡）+ 3~6 字窗口 + 书名号内容
      const chars = await dbAll('characters');
      const terms = new Set();
      for (const ch of chars) if (ch.name && query.includes(ch.name) && ch.name.length >= 2) terms.add(ch.name);
      const qBook = (query.match(/《([^》]{1,18})》/g) || []).map(s => s.replace(/《|》/g, ''));
      for (const b of qBook) if (b.length >= 2) terms.add(b);
      if (!terms.size) {
        // 无人物名/书名命中 → 退化为最近几章尾部（AI 至少感知进度）
        others.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
        const recent = others.slice(-2);
        const out = [];
        let used = 0;
        for (const c of recent) {
          const tail = (c.content || '').slice(-900);
          if (used + tail.length > maxChars) break;
          out.push('《' + (c.title || '') + '》……' + tail);
          used += tail.length;
        }
        return out.map(t => ({ tag: '前文回顾', text: t }));
      }
      // 按命中人物/专名统计各章相关性，取出命中所在句的上下文片段
      const scored = others.map(c => {
        let score = 0;
        for (const t of terms) { let i = 0; while ((i = c.content.indexOf(t, i)) !== -1) { score++; i += Math.max(1, t.length); } }
        return { c, score };
      }).filter(x => x.score > 0).sort((a, b) => b.score - a.score);
      if (!scored.length) return [];
      const excerpts = [];
      let used = 0;
      for (const { c } of scored) {
        if (used >= maxChars) break;
        const parts = [];
        for (const t of terms) {
          if (used >= maxChars) break;
          const idx = c.content.indexOf(t);
          if (idx === -1) continue;
          const from = Math.max(0, idx - 120);
          const to = Math.min(c.content.length, idx + t.length + 160);
          const seg = c.content.slice(from, to);
          if (parts.some(p => p.includes(t))) continue; // 同章同词只取一次
          parts.push('…' + seg + '…');
          used += seg.length;
        }
        if (parts.length) excerpts.push({ tag: '《' + (c.title || '') + '》前文片段', text: parts.join('\n') });
      }
      return excerpts;
    } catch (e) { return []; }
  },

  /* 组装写作上下文：检索文本 = 章节正文 + 本次指令 + 最近对话（保证“刚开始写、正文为空”时 AI 也能按你的话命中设定/人物）
     会话感知：大纲会话也独立携带自己的最近讨论，不与写作会话混淆 */
  async buildUserContext(curText = '') {
    let chatTail = '';
    try {
      const chat = await dbGet('chat', this.sid()) || { id: this.sid(), messages: [] };
      chatTail = chat.messages.slice(-6).filter(m => m.role === 'user').map(m => m.content).join('\n');
    } catch (e) { /* 忽略 */ }
    const searchText = curText + (chatTail ? '\n最近讨论：' + chatTail : '');
    const ctx = await AI.projectContext({ chapterId: this.curId, text: searchText });
    let body = ctx.text;
    // 当前章的章节大纲（写作方向提示）
    if (ctx.chapter) {
      const outline = normOutline(ctx.chapter.outline);
      if (outline.length) {
        const undone = outline.filter(o => !o.done);
        const done = outline.filter(o => o.done);
        body += '\n【本章大纲】' + (undone.length ? '\n待完成：\n' + undone.map(o => '· ' + o.text).join('\n') : '') + (done.length ? '\n已完成：' + done.map(o => o.text).join('；') : '') + '\n（写作应推进待完成的要点；完成一项后可在编辑器大纲里勾掉）\n';
      }
      const content = ctx.chapter.content || '';
      body += '\n\n【当前章节正文】《' + (ctx.chapter.title || '未命名') + '》\n' +
        (content ? '……' + content.slice(-4000) : '（本章还没有正文，从开头写起）');
    }
    // 全书记忆：最近几章摘要 + 与本次指令相关的章节摘要（写作 AI 懂全书剧情，不瞎编不矛盾）
    try {
      const mem = await this.bookMemoryText(this.curId, searchText);
      if (mem.length) {
        body += '\n\n【全书记忆（已发生剧情的章节摘要；续写须与之衔接，不得自造矛盾）】\n' + mem.join('\n\n');
      } else {
        body += '\n\n【全书记忆】（尚未生成：可点工具条「🧠 全书记忆」为已写章节生成摘要，此后写作 AI 将自动记住全书剧情，续写更连贯、不瞎编）';
      }
    } catch (e) { /* 记忆不可用不阻塞 */ }
    // 前文检索片段（按用户指令/对话中的人物与关键词，从前面章节捞相关正文）
    try {
      const hist = await this.fetchHistoryExcerpt(searchText);
      if (hist.length) {
        body += '\n\n【前文回顾（检索自之前的章节，帮助延续剧情/查证设定；注意区分章节归属）】\n';
        for (const h of hist) body += `—— ${h.tag} ——\n${h.text}\n`;
      }
    } catch (e) { /* 检索失败不影响主流程 */ }
    return '你是资深网文写作助手。写作要求：文笔流畅，避免 AI 腔（不堆排比、不每段总结、少用"然而/不禁/仿佛"）。' +
      '人设铁律：所有人物言行必须严格符合其【人物卡】中的性格与说话风格；写作前先依据【全书记忆/前文回顾】判断该角色此刻的状态与立场，言行合乎人设与既有行为逻辑，人设崩塌是严重错误。' +
      '设定铁律：必须遵守【世界观设定】中标 🔒 的核心铁律与全部已导入设定；写作涉及的境界/寿命/势力归属/地名/功法规则等只能引用既有设定，【绝不自行发明或更改设定】；与设定冲突时应停下说明而不是硬写。' +
      '剧情逻辑：续写必须严格衔接【全书记忆/前文回顾/当前章节正文】——不重复已发生的事、不推翻已写事实、不自造与上文矛盾的人物状态；人物当前在何处、与谁在一起、刚经历过什么，都要依据记忆来，拿不准就按已有信息合理推演，不要凭空发明。' +
      '铁律：绝不修改用户已写内容，只在你被要求的范围内输出。\n\n以下是你的项目记忆与当前正文：\n' + body;
  },

  async chatAsk(text, meta = { kind: 'chat' }) {
    if (this.busy) return;
    await this.flushSave(); // 确保 AI 读到最新正文
    const cid = this.sid();
    const chat = await dbGet('chat', cid) || { id: cid, messages: [] };
    const silent = !!meta.silentUser; // 换一版等：不重复显示用户消息
    if (!silent) {
      chat.messages.push({ role: 'user', content: text, ts: Date.now() });
      await dbPut('chat', chat);
    }
    this.renderChat();
    const sys = await this.buildUserContext(text);
    const hist = chat.messages.slice(-10).map(m => ({ role: m.role === 'assistant' ? 'assistant' : 'user', content: m.content }));
    if (silent) hist.push({ role: 'user', content: text }); // 本次指令作为最新输入
    this.setBusy(true);
    taskProgress(this.session === 'outlinechat' ? '🧠 大纲 AI 正在梳理本章大纲…' : '🤖 AI 正在思考/生成…');
    try {
      const reply = await AI.chat([{ role: 'system', content: sys }, ...hist]);
      chat.messages.push({ role: 'assistant', content: reply, ts: Date.now(), meta: { ...meta, reqText: text, sess: this.session } });
      await dbPut('chat', chat);
      await logAdd('AI对话', (meta.kind === 'chat' ? '对话：' : meta.label || '生成') + text.slice(0, 30));
    } catch (e) {
      chat.messages.push({ role: 'assistant', content: '⚠️ ' + e.message, ts: Date.now(), meta: { err: true } });
      await dbPut('chat', chat);
      toast(e.message, 'err');
    }
    taskProgressDone();
    this.setBusy(false);
    this.renderChat();
  },

  /* 🔄 换一版：静默重发原要求，明确要求生成不同版本（不重复显示用户消息） */
  async regenerate(meta) {
    const req = meta.reqText || '';
    const text = '（换一版）请基于刚才同一个要求，重新生成一版新的内容：角度、表达、细节与上一版明显不同，风格一致且符合人设；不要复述我的要求，直接输出新内容。\n原要求：' + req;
    await this.chatAsk(text, { ...meta, silentUser: true, label: '换一版' });
  },

  /* 💡 灵感：AI 基于当前章节+设定生成剧情灵感，可用/可收藏（带进度提示） */
  async getIdeas() {
    if (this.busy) return;
    const ch = await this.getCur();
    await this.flushSave();
    this.setBusy(true);
    taskProgress('💡 AI 正在生成灵感（基于本章大纲与设定）…');
    try {
      const ctx = await AI.projectContext({ chapterId: this.curId, text: '用户要灵感：请围绕本章当前进度与本章大纲提出走向建议' });
      const curOutline = ch ? normOutline(ch.outline).filter(o => !o.done).map(o => '· ' + o.text).join('\n') : '';
      const data = await AI.json([
        { role: 'system', content: '你是网文剧情灵感策划。基于当前章节、本章大纲与设定，给出具体可用的创作灵感：剧情走向、冲突爆发、伏笔回收、角色互动、金手指升级、反转、新场景等。每条要具体（谁+做了什么+引发什么），不要空泛套话。灵感应尽量贴合【本章大纲】里未完成的要点。\n' + ctx.text },
        { role: 'user', content: '当前章节《' + (ch ? ch.title : '') + '》末尾：\n' + (ch ? (ch.content || '').slice(-1500) : '（无正文）') + (curOutline ? '\n本章大纲（未完成要点）：\n' + curOutline : '') + '\n输出：{"ideas":[{"type":"剧情走向|冲突|伏笔|人物互动|金手指|反转|场景","title":"一句话标题","content":"具体灵感描述(50字左右)"}]}，6~8 条。' }
      ]);
      const ideas = (data.ideas || []).filter(i => i && i.content);
      if (!ideas.length) { taskProgressDone(); toast('未生成有效灵感，请重试', 'err'); return; }
      taskProgressDone();
      await this.showIdeas(ideas);
    } catch (e) {
      taskProgressDone();
      toast('灵感生成失败：' + e.message, 'err');
    } finally {
      taskProgressDone();
      this.setBusy(false); // 提前 return 也要解锁
    }
  },

  /* 灵感池（多选）：可勾选多条 → 收藏 或 送 AI 梳理成本章大纲（进对话细化 → 再「📌采纳为本章大纲」） */
  async showIdeas(ideas) {
    const saved = JSON.parse(localStorage.getItem('workbench_ideas') || '[]');
    const picks = {}; // idx -> true
    const body = el('div', {});
    const btnCount = () => body.querySelectorAll('.sel-n:checked').length;
    const renderIdeas = () => {
      body.innerHTML = '';

  closeModalAll() { $$('.modal-mask').forEach(m => m.remove()); },

  /* 续写（不选中任何内容时，AI 只能在文末续写） */
  async continueWrite() {
    const ch = await this.getCur();
    if (!ch) return;
    if (ch.locked) { toast('本章已锁定，无法续写', 'err'); return; }
    const tail = (ch.content || '').slice(-300);
    const text = `接着我的小说《${ch.title}》继续往下写（只能续写，不能改动我已有的内容），300~500 字，保持现有风格和视角。\n当前文末：${tail ? '……' + tail : '（本章还没有正文，请从开头写起）'}`;
    await this.chatAsk(text, { kind: 'cont', label: '续写' });
  },

  /* 🧠 章节识别：AI 识别人物/势力/关系 → 面板逐条确认 → 确认后自动更新 */
  async analyzeChapter() {
    const ch = await this.getCur();
    if (!ch) return;
    if (ch.locked) { toast('本章已锁定，请先解锁再识别', 'err'); return; }
    await this.flushSave(); // 先保存最新正文再识别
    this.setBusy(true);
    taskProgress('🧠 正在识别人物与势力…');
    try {
      const data = await CharOps.analyzeChapter(ch.id);
      taskProgressDone();
      await this.showRecognitionPanel(data, ch, { allMode: false });
    } catch (e) {
      taskProgressDone();
      toast('识别失败：' + e.message, 'err');
    } finally {
      this.setBusy(false); // 无论何种情况都恢复按钮与 AI 对话
    }
  },

  /* 📚 全书识别：逐章扫描已写正文 → 汇总 → 一次确认（跨章去重：先建的人物/势力在后续章不再重复建卡） */
  async analyzeAllChapters() {
    const all = await dbAll('chapters');
    const todo = all.filter(c => (c.content || '').trim() && !c.locked).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
    if (!todo.length) { toast(all.length ? '没有可识别的章节（正文为空或已锁定）' : '还没有章节', 'err'); return; }
    const total = todo.length;
    const stat = { people: 0, factions: 0, memberships: 0, relations: 0, updates: 0 };
    const merged = { people: [], factions: [], memberships: [], relations: [], updates: [] };
    const seenPeople = new Set((await dbAll('characters')).map(c => c.name));
    const seenFactions = new Set((await factionItems()).map(f => f.title));
    const fails = [];
    await this.flushSave();
    this.setBusy(true);
    try {
      for (let i = 0; i < total; i++) {
        const ch = todo[i];
        taskProgress(`📚 全书识别 ${i + 1}/${total}：扫描《${esc(ch.title)}》…（识别人物/势力/归属/关系）`);
        let data = null;
        try { data = await CharOps.analyzeChapter(ch.id); }
        catch (e) { fails.push({ title: ch.title, err: e.message }); continue; }
        // 跨章去重（AI 已按库内名单去重，这里再按本章先入名单兜底）
        for (const it of (data.people || [])) {
          if (!it || !it.name) continue;
          const n = it.name.trim();
          if (seenPeople.has(n)) { (data.updates = data.updates || []).push({ person: n, newFacts: (it.personality ? ['性格：' + it.personality] : []) }); continue; }
          seenPeople.add(n); merged.people.push({ ...it, fromChapter: ch.title }); stat.people++;
        }
        for (const it of (data.factions || [])) {
          if (!it || !it.name) continue;
          const n = it.name.trim();
          if (seenFactions.has(n)) continue;
          seenFactions.add(n); merged.factions.push({ ...it, fromChapter: ch.title }); stat.factions++;
        }
        for (const it of (data.memberships || [])) merged.memberships.push({ ...it, fromChapter: ch.title });
        for (const it of (data.relations || [])) merged.relations.push({ ...it, fromChapter: ch.title });
        for (const it of (data.updates || [])) merged.updates.push({ ...it, fromChapter: ch.title });
      }
      taskProgressDone();
      const mergedAny = ['people', 'factions', 'memberships', 'relations', 'updates'].some(k => merged[k].length);
      if (!mergedAny) {
        await logAdd('检测', '全书识别完成（无新人物/势力/关系/更新）' + (fails.length ? '，失败 ' + fails.length + ' 章' : ''));
        toast('全书扫描完成：各章人物/势力均已在库，无新增可采纳项' + (fails.length ? '；' + fails.length + ' 章失败见日志' : ''), fails.length ? 'err' : 'ok');
        if (fails.length) { for (const f of fails) await logAdd('检测', '全书识别章节失败《' + f.title + '》：' + f.err); }
        return;
      }
      if (fails.length) toast('有 ' + fails.length + ' 章识别失败，稍后在操作日志查看；先看成功结果', 'err');
      // 汇总确认面板（全库模式：带章来源 + 一键批量采纳人物/势力）
      await this.showRecognitionPanel({ ...merged }, { title: '全书（' + total + ' 章）' }, { allMode: true });
      const adopted = stat.people + stat.factions + stat.memberships + stat.relations + stat.updates;
      if (fails.length) for (const f of fails) await logAdd('检测', '全书识别章节失败《' + f.title + '》：' + f.err);
      await logAdd('检测', '全书识别完成：扫描 ' + total + ' 章' + (adopted ? '，发现 ' + adopted + ' 条待确认' : '') + (fails.length ? '，失败 ' + fails.length + ' 章' : ''));
    } catch (e) {
      taskProgressDone();
      toast('全书识别中断：' + e.message, 'err');
    } finally {
      this.setBusy(false);
    }
  },

  /* ===== 🧠 全书记忆：逐章生成剧情摘要，供写作 AI 携带（不瞎编/不违背设定的基础） ===== */
  contentFingerprint(text) { let h = 5381; const s = String(text || ''); for (let i = 0; i < s.length; i++) { h = ((h << 5) + h + s.charCodeAt(i)) >>> 0; } return h.toString(36); },

  /* 单章摘要：读正文+已有记忆上下文 → AI 输出剧情摘要 JSON */
  async chapterDigest(ch, knownChapters = []) {
    const ctx = await AI.projectContext({ chapterId: ch.id });
    // 近几章摘要作上下文（供 AI 知道衔接，避免孤立理解）
    const prev = knownChapters
      .filter(x => x.id !== ch.id && (x.createdAt || 0) < (ch.createdAt || 0) && x.digest && x.digest.text)
      .slice(-3)
      .map(x => `《${x.title}》：${x.digest.text.slice(0, 400)}`)
      .join('\n');
    const sys = '你是小说章节理解助手。阅读给定章节正文，输出该章的结构化剧情摘要。铁律：只依据正文与上文，不臆造、不补充正文没有的情节。\n' + ctx.text;
    const user = '上文（供衔接理解，勿写入摘要）：\n' + (prev || '（无）') + '\n\n待摘要章节《' + ch.title + '》正文：\n"""\n' + (ch.content || '').slice(0, 16000) + '\n"""\n输出：{"summary":"150~300字剧情摘要（按顺序写清楚：本章发生的关键事件、人物动向、冲突与悬念；不含设定背景铺垫）","people":["本章出场人物名"],"status":"本章结束时主要人物的状态/位置一句话"}' ;
    const data = await AI.json([{ role: 'system', content: sys }, { role: 'user', content: user }]);
    return {
      text: String(data.summary || '').trim(),
      people: Array.isArray(data.people) ? data.people.slice(0, 12).map(p => String(p)) : [],
      status: String(data.status || '').trim(),
      fp: this.contentFingerprint(ch.content || ''),
      at: Date.now()
    };
  },

  /* 🧠 全书记忆：逐章生成/刷新摘要（指纹未变的自动跳过），带进度 */
  async buildBookMemory() {
    const all = await dbAll('chapters');
    const todo = all.filter(c => (c.content || '').trim()).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
    if (!todo.length) { toast('还没有正文可摘要', 'err'); return; }
    const fresh = todo.filter(c => !(c.digest && c.digest.fp === this.contentFingerprint(c.content || '')));
    if (!fresh.length) { toast('✅ 各章摘要均为最新（正文未改动）；写作时 AI 会自动携带', 'ok'); return; }
    const total = todo.length;
    const fails = [];
    let made = 0;
    await this.flushSave();
    this.setBusy(true);
    try {
      for (let i = 0; i < todo.length; i++) {
        const ch = todo[i];
        if (ch.digest && ch.digest.fp === this.contentFingerprint(ch.content || '')) continue; // 未改动跳过
        taskProgress(`🧠 全书记忆 ${i + 1}/${total}：正在理解《${esc(ch.title)}》…`);
        try {
          const digest = await this.chapterDigest(ch, todo);
          if (!digest.text) throw new Error('AI 未返回有效摘要');
          ch.digest = digest;
          ch.updatedAt = Date.now();
          await dbPut('chapters', ch);
          made++;
        } catch (e) {
          fails.push({ title: ch.title, err: e.message });
        }
      }
      taskProgressDone();
      await logAdd('检测', '全书记忆：生成/刷新 ' + made + ' 章摘要' + (fails.length ? '，失败 ' + fails.length + ' 章' : ''));
      toast(fails.length ? '已生成 ' + made + ' 章摘要；' + fails.length + ' 章失败（见操作日志）' : '✅ 全书记忆已就绪（' + made + ' 章），写作时 AI 自动携带', fails.length ? 'err' : 'ok');
    } catch (e) {
      taskProgressDone();
      toast('全书记忆中断：' + e.message, 'err');
    } finally {
      this.setBusy(false);
    }
  },

  /* 写作上下文里的【全书记忆】：最近几章摘要 + 与本次正文/指令相关的章节摘要 */
  async bookMemoryText(curId, searchText, { recentN = 4, maxChars = 6000 } = {}) {
    try {
      const all = await dbAll('chapters');
      const withD = all.filter(c => c.digest && c.digest.text).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
      if (!withD.length) return [];
      const curIdx = withD.findIndex(c => c.id === curId);
      // 1) 最近 N 章（当前章之前）
      const take = withD.slice(Math.max(0, (curIdx >= 0 ? curIdx : withD.length) - recentN), curIdx >= 0 ? curIdx : withD.length);
      const lines = take.map(c => `《${c.title}》：${c.digest.text}${c.digest.status ? '（结尾：' + c.digest.status + '）' : ''}`);
      let used = lines.reduce((n, l) => n + l.length, 0);
      // 2) 与指令相关章节（命中人物名/关键词，未在最近列表里的）
      if (used < maxChars && searchText) {
        const chars = await dbAll('characters');
        const names = chars.map(x => x.name).filter(n => n && searchText.includes(n) && n.length >= 2);
        const words = (searchText.match(/《([^》]{1,20})》/g) || []).map(s => s.replace(/《|》/g, ''));
        const terms = [...names, ...words].filter(Boolean);
        if (terms.length) {
          for (const c of withD) {
            if (used >= maxChars) break;
            if (c.id === curId || take.includes(c)) continue;
            if (terms.some(t => (c.digest.text || '').includes(t) || (c.title || '').includes(t))) {
              const l = `《${c.title}》：${c.digest.text}`;
              if (used + l.length > maxChars) break;
              lines.push(l); used += l.length;
            }
          }
        }
      }
      return lines;
    } catch (e) { return []; }
  },

  async showRecognitionPanel(data, ch, opts = {}) {
    const allMode = !!opts.allMode;
    const sections = [
      { key: 'people', icon: '👤', title: '新人物' },
      { key: 'factions', icon: '🏯', title: '新势力' },
      { key: 'memberships', icon: '🔗', title: '人物归属' },
      { key: 'relations', icon: '💞', title: '人物关系' },
      { key: 'updates', icon: '📌', title: '已有人物新信息' }
    ];
    const pending = {};
    for (const s of sections) pending[s.key] = Array.isArray(data[s.key]) ? data[s.key].slice() : [];
    const total = sections.reduce((n, s) => n + pending[s.key].length, 0);
    if (!total) { toast(allMode ? '全书未识别到新的人物/势力/关系信息' : '本章未识别到新的人物/势力/关系信息', 'info'); return; }
    const stats = { people: 0, factions: 0, memberships: 0, relations: 0, updates: 0 };
    let done = 0;
    const body = el('div', {});
    const srcTag = (item) => (allMode && item && item.fromChapter) ? ` <span class="src" style="font-size:11px;color:#999">源自《${esc(item.fromChapter)}》</span>` : '';
    const descOf = (s, item) => {
      if (s === 'people') return `${item.name}${item.personality ? ' · ' + item.personality : ''}${(item.skills || []).length ? ' · 技能：' + item.skills.map(x => x.name).join('、') : ''}`;
      if (s === 'factions') return `${item.name}（${item.type || '势力'}）${item.desc ? '：' + item.desc : ''}${(item.members || []).length ? ' · 成员：' + item.members.join('、') : ''}`;
      if (s === 'memberships') return `${item.person} → ${item.faction}${item.role ? ' · ' + item.role : ''}`;
      if (s === 'relations') return `${item.a} ↔ ${item.b}（${item.type}）`;
      return `${item.person}：${(item.newFacts || []).join('；')}`;
    };
    const renderList = () => {
      body.innerHTML = '';
      let left = 0;
      // 全库模式：顶部快捷「采纳全部人物+势力」（先建好卡，归属/关系再采纳就有依赖了）
      if (allMode && (pending.people.length || pending.factions.length)) {
        body.appendChild(el('div', { style: 'display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap' },
          el('span', { class: 'muted', style: 'font-size:12.5px', text: '提示：先采纳人物与势力（或一键采纳），「人物归属/关系」依赖它们存在。' }),
          el('div', { class: 'spacer', style: 'flex:1' }),
          el('button', { class: 'btn small primary', text: '⚡ 采纳全部人物+势力（' + (pending.people.length + pending.factions.length) + '）', onclick: async () => {
            if (!(await confirmDlg('一键采纳全部 ' + (pending.people.length + pending.factions.length) + ' 条人物/势力？（AI 建议，仍可在采纳后去「人物/世界观」页编辑）'))) return;
            for (const s of ['people', 'factions']) {
              const items = pending[s].slice();
              for (const item of items) {
                await CharOps.applyItem(s === 'factions' ? 'factions' : 'people', item);
                pending[s] = pending[s].filter(x => x !== item);
                done++; stats[s]++;
              }
            }
            renderList();
          } })
        ));
      }
      for (const s of sections) {
        const items = pending[s.key];
        if (!items.length) continue;
        left += items.length;
        body.appendChild(el('div', { style: 'font-weight:700;margin:12px 0 6px', text: s.icon + ' ' + s.title + '（' + items.length + ' 条）' }));
        for (const item of items) {
          const row = el('div', { style: 'display:flex;gap:8px;align-items:center;padding:7px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;flex-wrap:wrap;background:var(--bg)' },
            el('span', { html: esc(descOf(s.key, item)) + srcTag(item), style: 'flex:1;min-width:150px;font-size:13.5px;line-height:1.6' }),
            el('button', { class: 'btn small primary', text: '✅ 采纳', onclick: async () => {
              const ok2 = await CharOps.applyItem(s.key, item);
              if (!ok2 && s.key === 'memberships') { toast('该势力尚未创建，请先采纳对应「新势力」', 'err'); return; }
              if (!ok2 && (s.key === 'relations' || s.key === 'updates')) { toast('相关人物尚未创建，请先采纳其「新人物」', 'err'); return; }
              pending[s.key] = pending[s.key].filter(x => x !== item);
              done++; stats[s.key]++;
              renderList();
            } }),
            el('button', { class: 'btn small', text: '✗ 忽略', onclick: async () => {
              pending[s.key] = pending[s.key].filter(x => x !== item);
              done++;
              renderList();
            } }),
            s.key !== 'updates' ? el('button', { class: 'btn small', text: '✏️ 修改', onclick: async () => {
              const field = s.key === 'people' ? '姓名' : s.key === 'factions' ? '势力名' : s.key === 'memberships' ? '职位' : '关系类型';
              const cur = s.key === 'memberships' ? (item.role || '') : s.key === 'relations' ? (item.type || '') : (item.name || '');
              const v = await promptDlg('修改' + field, cur);
              if (v) {
                if (s.key === 'memberships') item.role = v;
                else if (s.key === 'relations') item.type = v;
                else item.name = v;
                renderList();
              }
            } }) : null
          );
          body.appendChild(row);
        }
      }
      const bar = $('#rec-progress');
      if (bar) bar.textContent = left ? `⏳ 剩余 ${left} 条待确认（采纳后自动更新到人物/势力）` : '✅ 全部处理完毕，可关闭';
    };
    body.appendChild(el('div', { style: 'display:flex;justify-content:space-between;align-items:center;margin-bottom:6px' },
      el('span', { id: 'rec-progress', class: 'muted' }),
      el('button', { class: 'btn small danger', text: '全部忽略', onclick: async () => {
        if (!(await confirmDlg('忽略本次识别的全部 ' + (total - done) + ' 条？'))) return;
        for (const s of sections) pending[s.key] = [];
        done = total;
        renderList();
      } })
    ));
    renderList();
    await modal({

  /* 📌 把一条 AI 回复采纳为本章大纲：AI 拆成要点列表 → 预览可编辑 → 写入 chapters.outline */
  async adoptAsChapterOutline(msg) {
    const ch = await this.getCur();
    if (!ch) return;

    if (!text) { toast('该回复为空', 'err'); return; }

    try {

          const v = await promptDlg('新增要点', '', '剧情要点');

        } }));
      };
      render();
      const ok = await modal({
        title: '📌 采纳为本 章大纲 · 《' + ch.title + '》', body,
        okText: '💾 保存为本 章大纲',
        cancelText: '取消'
      });
      if (!ok) return;
      const final = pts.filter((p, i) => picks[i]).map(p => ({ id: uid(), text: p.trim(), done: false }));
      if (!final.length) { toast('未选择任何要点', 'err'); return; }
      let added = 0;
      if (merge && existing.length) {
        const seen = new Set(existingTexts);
        const add = final.filter(x => !seen.has(x.text));
        added = add.length;

      } else {
        ch.outline = final;
      }
      ch.updatedAt = Date.now();
      await dbPut('chapters', ch);
      await logAdd('大纲', 'AI 回复采纳为本章大纲（《' + ch.title + '》' + (merge && existing.length ? '合并新增 ' + added + ' 点，保留旧 ' + existing.length + ' 点' : '替换为 ' + final.length + ' 点') + '）');
      toast(merge && existing.length ? '本章大纲已更新（新增 ' + added + ' 点，旧要点保留）' : '本章大纲已更新', 'ok');
      if (this.applyOutline) this.applyOutline();
    } catch (e) {
      taskProgressDone();
      toast('整理失败：' + e.message, 'err');
    } finally {
      taskProgressDone();
      this.setBusy(false); // 提前 return（未拆出要点/用户取消）也要解锁
    }
  },

  /* 采纳 AI 回复：插入正文（先快照，可回滚） */
  async applyReply(msg) {
    const meta = msg.meta || {};
    if (meta.kind === 'report' || meta.kind === 'ooc') { toast('检查是报告，不直接修改文本（可按建议手动修改）', 'info'); return; }

    const ch = await this.getCur();

    if (ch.locked) { toast('本章已锁定', 'err'); return; }

    const text = (msg.content || '').replace(/^["'“”]+|["'“”]+$/g, '').trim();

    if (meta.kind === 'sel' && typeof meta.selStart === 'number') {

  }
};
